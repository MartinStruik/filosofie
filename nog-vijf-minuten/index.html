<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nog vijf minuten: Plato’s drie zielsdelen</title>
<style>
:root{
  /* Eén toneel van 16:9, de wand van een Griekse vaas. Buiten: zwart op klei. Binnen: klei op zwart.
     De telefoon is het enige moderne ding en het enige koele licht. */
  --klei:#cf7741; --kleiL:#e39a5d; --zwart:#17100c; --room:#f3e3c6; --room2:#cdb894; --purper:#7e2b27; --vuur:#ff8a2a; --fout:#f2a48f;
  --display:"GFS Didot","Didot","Bodoni MT","Palatino Linotype",Georgia,serif;
  --tekst:"Commissioner","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#060403;color:var(--room);font-family:var(--tekst);color-scheme:dark;display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--room);outline-offset:3px}
p{margin:0}

#toneel{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;overflow:hidden;background:var(--zwart);font-size:calc(var(--b,1000px)*0.0165);line-height:1.38;user-select:none;-webkit-user-select:none}
#beeld{position:absolute;inset:0;width:100%;height:100%;display:block}
#beeld text{font-family:var(--tekst)}
#beeld .grieks{font-family:var(--display);font-size:19px;letter-spacing:.3em;fill:var(--klei)}
#beeld .nlnaam{font-size:19px;font-weight:600;fill:var(--room);letter-spacing:.02em}
#beeld .koplabel{font-size:19px;font-weight:600;fill:var(--zwart)}
#beeld .kopbord{fill:var(--klei);stroke:var(--zwart);stroke-width:2}
#beeld .lab.tam .kopbord{fill:var(--room)}
#beeld .kader{fill:none;stroke:var(--klei);stroke-width:2;opacity:.5;transition:opacity .4s,stroke-width .4s}
#beeld .kader.aan{opacity:1;stroke-width:6;stroke:var(--room)}
#beeld .klimop{transition:opacity .8s}
#beeld .tondolabel{font-family:var(--display);font-size:17px;letter-spacing:.26em;fill:var(--zwart)}
#korrel{position:absolute;inset:0;pointer-events:none;background-size:220px 220px;opacity:.5}
#nacht{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 40% 62%,rgba(30,22,60,.5),rgba(4,3,14,.96));mix-blend-mode:multiply;transition:opacity 1.2s}
#zwart{position:absolute;inset:0;background:#0c0806;opacity:0;pointer-events:none;z-index:40}

#kop{position:absolute;left:1.5em;top:.52em;padding:.1em .9em .12em;background:var(--zwart);border:1px solid var(--klei);font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:.84em;color:var(--kleiL)}
#hoek{position:absolute;right:1.2em;top:.55em;display:flex;gap:.5em;z-index:45}
#hoek button{padding:.28em .8em;background:var(--zwart);border:1px solid rgba(243,227,198,.35);border-radius:.25em;font-size:.6em;letter-spacing:.05em;color:var(--room2)}
#hoek button:hover{border-color:var(--room);color:var(--room)}

#bubbels{position:absolute;inset:0;pointer-events:none;z-index:6}
.bubbel{position:absolute;transform:translate(-50%,-100%);max-width:15em;padding:.42em .8em .46em;background:var(--room);color:var(--zwart);border:2px solid var(--zwart);border-radius:.9em;font-weight:500;line-height:1.25;animation:op .22s ease-out;box-shadow:0 .2em .6em rgba(0,0,0,.25)}
.bubbel::after{content:"";position:absolute;left:50%;bottom:-.52em;width:.8em;height:.8em;background:var(--room);border-right:2px solid var(--zwart);border-bottom:2px solid var(--zwart);transform:translateX(-50%) rotate(45deg)}
.bubbel.klein{font-size:.82em;padding:.3em .65em .34em}
.bubbel.binnen{background:var(--zwart);color:var(--room);border-color:var(--klei)}
.bubbel.binnen::after{background:var(--zwart);border-color:var(--klei)}
.bubbel.sis{background:var(--klei);color:var(--zwart);border-color:var(--zwart);font-weight:600}
.bubbel.sis::after{background:var(--klei)}
.bubbel.weg{opacity:0;transition:opacity .3s}
@keyframes op{from{opacity:0;transform:translate(-50%,-100%) translateY(.4em)}to{opacity:1;transform:translate(-50%,-100%)}}

#bijschrift{position:absolute;left:11.5em;top:3.5em;width:23em;padding:.6em 1em .7em;background:rgba(12,8,6,.9);border:1px solid var(--klei);border-radius:.3em;animation:in .3s ease-out}
#bijschrift.licht{background:rgba(243,227,198,.94);color:var(--zwart);border-color:var(--zwart)}
#bijschrift .t{font-family:var(--display);font-size:1.25em;letter-spacing:.04em;color:var(--kleiL);margin-bottom:.15em}
#bijschrift.licht .t{color:var(--purper)}
#bijschrift p{font-size:.86em}
@keyframes in{from{opacity:0}to{opacity:1}}

#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#gesprek{position:absolute;left:1.5em;bottom:.9em;width:43.2em;padding:.75em 1.1em .85em;background:rgba(14,9,7,.94);border:1px solid var(--klei);border-radius:.35em;box-shadow:0 0 0 .22em rgba(14,9,7,.7);animation:in .25s ease-out}
#gesprek.breed{width:57.6em}
#gesprek.kaal #spreker{display:none}
#spreker{font-family:var(--display);font-size:.84em;letter-spacing:.16em;text-transform:uppercase;color:var(--kleiL);margin-bottom:.2em}
#tekst{font-size:1em;min-height:1.4em}
#tekst em{font-style:normal;color:var(--kleiL);font-weight:600}
#tekst .bron{display:block;margin-top:.3em;font-size:.72em;color:var(--room2);letter-spacing:.02em}
#antw{display:flex;flex-direction:column;gap:.38em;margin-top:.6em}
#antw.rij{flex-direction:row;justify-content:flex-end;flex-wrap:wrap}
#antw:empty{display:none}
#antw button{padding:.42em .9em .46em;text-align:left;background:rgba(243,227,198,.05);border:1.5px solid rgba(243,227,198,.3);border-radius:.3em;font-size:.94em;transition:border-color .15s,background .15s,opacity .2s}
#antw button:hover:not(:disabled){border-color:var(--kleiL);background:rgba(207,119,65,.16)}
#antw button:disabled{opacity:.5}
#antw button.gekozen{opacity:1;border-color:var(--kleiL);background:rgba(207,119,65,.24)}
#antw button.door,.knop{padding:.42em 1.5em .46em;background:var(--klei);color:var(--zwart);border:1.5px solid var(--klei);border-radius:.3em;font-weight:600;letter-spacing:.03em;text-align:center}
#antw button.door:hover:not(:disabled),.knop:hover:not(:disabled){background:var(--kleiL);border-color:var(--kleiL)}
#antw button.door:disabled{opacity:.45}
#antw button.gedaan{opacity:.55;border-style:dashed}
.knop.stil{background:transparent;color:var(--room);border-color:rgba(243,227,198,.4)}
.knop.stil:hover:not(:disabled){background:rgba(243,227,198,.08);border-color:var(--room)}
#extra:empty{display:none}
#terug{position:absolute;right:.9em;top:.62em;padding:.2em .7em .24em;background:transparent;border:1px solid rgba(243,227,198,.3);border-radius:.25em;font-size:.62em;letter-spacing:.05em;color:var(--room2)}
#terug::before,#leesterug::before{content:"\2039\00a0"}
#leesvooruit::after{content:"\00a0\203a"}
#terug:hover{border-color:var(--room);color:var(--room)}
#gesprek.kaal #tekst{padding-right:4.2em}
#leesrij{display:none;gap:.5em;margin-top:.6em}
#leesrij button{padding:.36em 1em .4em;background:transparent;border:1.5px solid rgba(243,227,198,.4);border-radius:.3em;font-size:.9em}
#leesrij button:hover:not(:disabled){border-color:var(--room);background:rgba(243,227,198,.08)}
#leesrij button:disabled{opacity:.35}
#leesdek{position:absolute;inset:0;z-index:40;background:rgba(14,9,7,.45);cursor:pointer}
#gesprek.lezen{z-index:41;border-style:dashed;border-color:var(--room2);background:rgba(30,22,17,.97)}
#gesprek.lezen #leesrij{display:flex}
#gesprek.lezen #antw,#gesprek.lezen #extra,#gesprek.lezen #terug{display:none}
#gesprek.lezen #tekst{color:var(--room2)}
#spreker .eerder{margin-left:.9em;padding:.05em .6em .08em;border:1px solid var(--room2);border-radius:1em;font-family:var(--tekst,inherit);font-size:.74em;letter-spacing:.04em;text-transform:none;color:var(--room2)}
.leeskeus{display:block;margin-top:.5em;font-size:.9em}
.leeskeus span{display:block;padding:.16em .7em;margin-top:.22em;border:1px dashed rgba(243,227,198,.25);border-radius:.3em;opacity:.7}
.leeskeus span.k{border-style:solid;border-color:var(--kleiL);opacity:1;color:var(--room)}

#roep{position:absolute;left:1.5em;bottom:1.3em;padding:.6em 1.3em .66em;background:var(--room);color:var(--zwart);border:2px solid var(--zwart);border-radius:2em;font-weight:600;box-shadow:0 .25em 0 var(--zwart);transition:transform .08s,box-shadow .08s}
#roep:active{transform:translateY(.2em);box-shadow:0 .05em 0 var(--zwart)}
#roep small{display:block;font-weight:400;font-size:.68em;opacity:.7;margin-top:-.1em}

#term{position:absolute;right:16.4em;top:3.5em;width:17em;padding:.6em .9em .7em;background:rgba(14,9,7,.92);border:1px solid var(--klei);border-radius:.3em;animation:in .3s ease-out}
#term .t{font-weight:600;font-size:1.05em;margin-bottom:.15em}
#term .t span{font-family:var(--display);font-weight:400;color:var(--kleiL);letter-spacing:.12em;margin-right:.5em}
#term p+p{font-size:.84em;color:var(--room2)}

#kaart{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,4,3,.72);z-index:20;animation:in .35s ease-out}
#kaart .vel{width:36em;padding:1.5em 1.9em 1.4em;background:var(--room);color:var(--zwart);border-radius:.25em;box-shadow:0 1em 3em rgba(0,0,0,.6);background-image:repeating-linear-gradient(transparent 0 1.72em,rgba(23,16,12,.1) 1.72em calc(1.72em + 1px));border-left:.5em solid var(--purper)}
#kaartkop{font-family:var(--display);font-size:1.5em;letter-spacing:.03em;color:var(--purper);margin-bottom:.3em}
#kaarttekst{font-size:1.08em;line-height:1.5}
#kaarttekst b{font-weight:600}
#kaart .knop{margin-top:1.1em;background:var(--zwart);color:var(--room);border-color:var(--zwart);font-variant-numeric:tabular-nums;min-width:11em}
#kaart .knop:disabled{background:transparent;color:rgba(23,16,12,.6);border-color:rgba(23,16,12,.3)}

#deelkaart{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:.3em;background:#0c0806;z-index:30;text-align:center;animation:in .5s ease-out}
#deelkaart .nr{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-size:.9em;color:var(--klei)}
#deelkaart h2{margin:0;font-family:var(--display);font-weight:400;font-size:3.4em;letter-spacing:.02em}
#deelkaart .sub{color:var(--room2);max-width:28em}

/* ---------- de telefoon ---------- */
#tel{position:absolute;right:1.2em;top:3.05em;width:14em;height:30.2em;padding:.42em;background:#0a0a0c;border-radius:1.9em;box-shadow:0 0 0 .1em #2c2c31,0 .8em 2.4em rgba(0,0,0,.55),0 0 3.5em rgba(150,205,255,.16);transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .5s;font-size:1em;z-index:5}
#tel.weg{transform:translateX(18em);opacity:0}
#tel.donker{box-shadow:0 0 0 .1em #2c2c31,0 .8em 2.4em rgba(0,0,0,.55)}
.tscherm{position:relative;width:100%;height:100%;border-radius:1.55em;overflow:hidden;background:#f4f6f9;color:#14171c;font-size:.7em;line-height:1.3;display:flex;flex-direction:column}
.tbalk{display:flex;justify-content:space-between;align-items:center;padding:.5em 1.3em .3em;font-weight:600;font-size:.88em;flex:none;z-index:3;font-variant-numeric:tabular-nums}
.tbalk i{display:inline-block;width:1.5em;height:.72em;border:1.5px solid currentColor;border-radius:.2em;position:relative;opacity:.8}
.tbalk i::after{content:"";position:absolute;inset:1px;right:35%;background:currentColor;border-radius:.08em}
.tinhoud{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.tzwart{position:absolute;inset:0;background:#050506;opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
.tscherm.uit .tzwart{opacity:1}
.tmelding{position:absolute;left:.6em;right:.6em;top:.5em;padding:.6em .8em;background:rgba(250,250,252,.97);color:#14171c;border-radius:1em;box-shadow:0 .4em 1.4em rgba(0,0,0,.35);z-index:6;transform:translateY(-140%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.tmelding.aan{transform:none}
.tmelding.veeg{transform:translateX(120%);transition:transform .22s ease-in}
.tmelding b{display:block;font-size:.8em;color:#5c6470;font-weight:600;letter-spacing:.02em}
/* chat */
.chatkop{display:flex;align-items:center;gap:.7em;padding:.5em 1em .6em;border-bottom:1px solid #e2e6ec;background:#fff;flex:none}
.chatkop .rond{width:2.2em;height:2.2em;border-radius:50%;background:#f0a23b;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.chatkop .rond.groep{background:#5b6ee1}
.chatkop strong{display:block;font-size:1.02em}
.chatkop small{color:#6b7480;font-size:.82em}
.chatlijst{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:.34em;padding:.7em .8em}
.bel{max-width:82%;padding:.48em .78em .52em;border-radius:1.1em;background:#e6e9ee;align-self:flex-start;animation:bel .2s ease-out;overflow-wrap:anywhere}
.bel.ik{align-self:flex-end;background:#2f7cf6;color:#fff}
.bel.weg{background:transparent;border:1px dashed #9aa3af;color:#7a838f;font-style:italic}
.bel .van{display:block;font-size:.8em;font-weight:700;color:#c2571a;margin-bottom:.1em}
.bel .van.b{color:#0f8a5f}.bel .van.c{color:#8a3fd1}
.tijd{align-self:center;font-size:.76em;color:#7a838f;margin:.3em 0}
.stat{align-self:flex-end;font-size:.74em;color:#7a838f;margin-top:-.15em}
.video{position:relative;width:11.5em;height:8.2em;border-radius:.8em;overflow:hidden;background:linear-gradient(135deg,#8d9bb0,#c9b7a6 45%,#7f8fa8);margin-top:.3em}
.video::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 40% 55%,rgba(60,50,60,.75),transparent 34%),radial-gradient(circle at 68% 40%,rgba(240,230,220,.7),transparent 30%);filter:blur(.7em)}
.video .speel{position:absolute;left:50%;top:50%;width:2.6em;height:2.6em;margin:-1.3em;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.video .speel::after{content:"";border-left:.9em solid #fff;border-top:.55em solid transparent;border-bottom:.55em solid transparent;margin-left:.2em}
.video .duur{position:absolute;right:.5em;bottom:.4em;font-size:.76em;color:#fff;background:rgba(0,0,0,.5);padding:0 .4em;border-radius:.4em}
.video .balk{position:absolute;left:0;bottom:0;height:.25em;width:0;background:#fff}
.video.loopt .speel{opacity:0}
.video.loopt::before{animation:woel 1.1s ease-in-out infinite alternate}
.video.wenk .speel{animation:pols .9s ease-in-out infinite}
@keyframes woel{to{transform:translate(6%,-4%) scale(1.08)}}
@keyframes pols{50%{transform:scale(1.18);background:rgba(0,0,0,.75)}}
@keyframes bel{from{opacity:0;transform:translateY(.5em)}to{opacity:1;transform:none}}
.invoer{display:flex;align-items:flex-end;gap:.5em;padding:.5em .7em .7em;background:#fff;border-top:1px solid #e2e6ec;flex:none}
.invoer .veld{flex:1;min-height:2.2em;max-height:9.5em;overflow:hidden;padding:.44em .8em;border:1px solid #cfd5dd;border-radius:1.1em;background:#f7f8fa;overflow-wrap:anywhere}
.invoer .veld:empty::before{content:"Bericht";color:#9aa3af}
.invoer .veld.typt::after{content:"";display:inline-block;width:2px;height:1.05em;background:#2f7cf6;vertical-align:-.15em;margin-left:1px;animation:knip 1s steps(1) infinite}
@keyframes knip{50%{opacity:0}}
.invoer .pijl{width:2.2em;height:2.2em;border-radius:50%;background:#c3cad4;flex:none;display:grid;place-items:center;transition:background .15s,transform .12s}
.invoer .pijl::after{content:"";border-bottom:.62em solid #fff;border-left:.4em solid transparent;border-right:.4em solid transparent}
.invoer .pijl.klaar{background:#2f7cf6}
.invoer .pijl.druk{transform:scale(.82)}
/* swiep */
.swiep{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden}
.swiep .tab{position:absolute;top:.3em;left:0;right:0;text-align:center;font-weight:700;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.5);font-size:.95em}
.swiep .tab span{opacity:.55;font-weight:500;margin:0 .5em}
.filmpje{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:1em 3.4em 1.4em 1em;transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.filmpje.onder{transform:translateY(100%)}
.filmpje.boven{transform:translateY(-100%)}
.filmpje .vorm{position:absolute;left:50%;top:42%;width:9em;height:9em;margin:-4.5em;border-radius:38%;animation:draai 3.2s linear infinite;opacity:.9}
.filmpje h4{margin:0 0 .2em;font-size:1.12em;position:relative;text-shadow:0 1px 5px rgba(0,0,0,.45)}
.filmpje p{position:relative;font-size:.86em;opacity:.92;text-shadow:0 1px 5px rgba(0,0,0,.45)}
.filmpje .zij{position:absolute;right:.7em;bottom:1.6em;display:flex;flex-direction:column;gap:.9em;align-items:center;font-size:.76em;font-weight:600}
.filmpje .zij i{display:block;width:2.3em;height:2.3em;border-radius:50%;background:rgba(255,255,255,.22);margin:0 auto .15em}
@keyframes draai{to{transform:rotate(360deg)}}
/* beginscherm */
.thuis{position:absolute;inset:0;background:linear-gradient(160deg,#27425f,#5d4a7a 55%,#b56a5a);color:#fff;padding:1.2em 1em;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:1.1em .5em;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:.25em;font-size:.76em;position:relative;transition:transform .3s,opacity .3s}
.app i{width:3.5em;height:3.5em;border-radius:.95em;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:1.25em;color:#fff;box-shadow:0 .2em .5em rgba(0,0,0,.25)}
.thuis.wiebel .app{animation:wiebel .28s ease-in-out infinite alternate}
.thuis.wiebel .app:nth-child(even){animation-delay:.12s}
.app.doel i{outline:.18em solid #fff}
.app.poef{transform:scale(0);opacity:0}
.app .kruis{position:absolute;left:.2em;top:-.5em;width:1.6em;height:1.6em;border-radius:50%;background:#e9edf2;color:#222;display:none;place-items:center;font-weight:700;line-height:1}
.thuis.wiebel .app.doel .kruis{display:grid}
@keyframes wiebel{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}
.dialoog{position:absolute;left:1.2em;right:1.2em;top:36%;padding:1.1em 1em .8em;background:rgba(248,248,250,.97);color:#14171c;border-radius:1.2em;text-align:center;box-shadow:0 .6em 2em rgba(0,0,0,.4);z-index:4;animation:bel .2s ease-out}
.dialoog b{display:block;margin-bottom:.2em}
.dialoog small{display:block;color:#5c6470;margin-bottom:.8em}
.dialoog .rijk{display:flex;border-top:1px solid #d5dae1;margin:0 -1em -.8em}
.dialoog .rijk span{flex:1;padding:.7em 0;color:#2f7cf6;font-weight:600}
.dialoog .rijk span+span{border-left:1px solid #d5dae1;color:#e0392b}
.dialoog .rijk span.druk{background:#e6e9ee}
/* winkel en schoolapp */
.blad{position:absolute;inset:0;background:#fff;padding:1.2em 1.1em;display:flex;flex-direction:column;gap:.8em}
.blad h3{margin:0;font-size:1.3em}
.blad .rijapp{display:flex;align-items:center;gap:.8em}
.blad .rijapp i{width:3.6em;height:3.6em;border-radius:1em;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:1.2em;flex:none}
.blad .haal{margin-left:auto;padding:.4em 1em;border-radius:1.2em;background:#2f7cf6;color:#fff;font-weight:700;font-size:.86em;white-space:nowrap;position:relative;overflow:hidden}
.blad .haal.bezig{background:#c3cad4}
.blad .haal.bezig::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--deel,0%);background:#2f7cf6;opacity:.7;transition:width .2s linear}
.blad .haal span{position:relative;z-index:1}
.cijferkaart{border:1px solid #dfe3e9;border-radius:1em;padding:.9em 1em;display:flex;align-items:center;gap:1em}
.cijferkaart .getal{font-size:2.6em;font-weight:800;color:#d9372a;font-variant-numeric:tabular-nums;line-height:1}
.cijferkaart small{color:#6b7480;display:block}
.blad .grijs{color:#6b7480;font-size:.86em}

/* ---------- het lab: de leeuw afstellen ---------- */
.lab{display:grid;grid-template-columns:1.05fr 1.25fr auto;gap:1.3em;align-items:end;margin-top:.55em}
.lab .blok{display:grid;gap:.28em}
.lab .lbl{font-size:.8em;color:var(--room2)}
.lab .kant{display:flex;gap:.4em}
.lab .kant button{flex:1;padding:.36em .5em .4em;background:transparent;border:1.5px solid rgba(243,227,198,.3);border-radius:.3em;font-size:.92em;white-space:nowrap}
.lab .kant button.aan{background:var(--room);color:var(--zwart);border-color:var(--room);font-weight:600}
.lab input[type=range]{width:100%;accent-color:var(--vuur);height:1.5em;margin:0}
.lab .maat{display:flex;justify-content:space-between;font-size:.76em;color:var(--room2);margin-top:-.2em}
.lab .maat span.aan{color:var(--vuur);font-weight:700}
.lab.bezig{opacity:.4;pointer-events:none}
.lab .knop:disabled{opacity:.38}
.lab .lbl b{display:inline-grid;place-items:center;width:1.5em;height:1.5em;margin-right:.35em;border:1px solid var(--room2);border-radius:50%;font-size:.86em;font-weight:600;color:var(--room)}
.lab .lbl i{font-style:normal;margin-left:.5em;padding:.02em .55em .06em;border:1px solid rgba(243,227,198,.3);border-radius:1em;font-size:.9em}
.lab .kant button.gedaan:not(.aan){opacity:.55;border-style:dashed}
.lab.fase1{grid-template-columns:1.5fr 1fr auto}
.lab.fase1 .kantblok .lbl{color:var(--room);font-size:.9em}
.lab.fase1 .kantblok .lbl b{background:var(--kleiL);border-color:var(--kleiL);color:var(--zwart)}
.lab.fase1 .kant button{padding:.5em .6em .56em;font-size:1em;border-color:var(--kleiL)}
.lab.fase1 .vuurblok{opacity:.5}
.lab input[type=range]:disabled{cursor:default}
#doelen{position:absolute;inset:0;pointer-events:none}
.doel{position:absolute;pointer-events:auto;padding:0;background:transparent;border:.13em dashed var(--kleiL);border-radius:50%;animation:doelpols 1.6s ease-in-out infinite;transition:background .2s,border-color .2s,opacity .2s}
.doel.beest{left:8.1%;top:22.2%;width:31.2%;height:44.4%}
.doel.mens{left:63.75%;top:36.7%;width:10%;height:30%}
.doel span{position:absolute;left:50%;top:0;transform:translate(-50%,-58%);padding:.1em .75em .16em;background:var(--zwart);border:1px solid var(--kleiL);border-radius:1em;font-size:.8em;white-space:nowrap;color:var(--kleiL)}
.doel:hover{background:rgba(227,154,93,.1);border-style:solid}
.doel.aan{border-style:solid;border-color:var(--room);animation:none;background:rgba(243,227,198,.05)}
.doel.aan span{background:var(--room);color:var(--zwart);border-color:var(--room);font-weight:600}
.doel.gezien:not(.aan){opacity:.5;animation:none}
@keyframes doelpols{0%,100%{box-shadow:0 0 0 0 rgba(227,154,93,0)}50%{box-shadow:0 0 0 .55em rgba(227,154,93,.16)}}
#zes{position:absolute;left:23.4em;top:3.4em;padding:.45em .55em .5em;background:rgba(14,9,7,.9);border:1px solid var(--klei);border-radius:.3em;animation:in .4s}
#zes .t{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:.72em;color:var(--kleiL);margin:0 0 .2em .3em}
table.zes{border-collapse:separate;border-spacing:.22em;font-size:.72em}
table.zes th{font-weight:500;color:var(--room2);padding:0 .3em;text-align:center;white-space:nowrap}
table.zes th.rij{text-align:right;padding-right:.5em}
table.zes td{width:6.5em;height:2.9em;border:1.5px dashed rgba(243,227,198,.28);border-radius:.3em;text-align:center;color:rgba(243,227,198,.35);line-height:1.15;padding:.1em .2em;transition:background .3s,border-color .3s}
table.zes td.nu{border-color:var(--vuur);box-shadow:0 0 0 1px var(--vuur)}
table.zes td.op{border-style:solid;border-color:var(--klei);color:var(--room);background:rgba(207,119,65,.18);font-weight:600}
table.zes td.op.goed{background:var(--room);color:var(--zwart);border-color:var(--room)}
table.zes td.wijs{box-shadow:0 0 0 2px var(--vuur);animation:pols2 1s ease-in-out infinite}
@keyframes pols2{50%{box-shadow:0 0 0 4px rgba(255,138,42,.4)}}

/* ---------- deugden plaatsen ---------- */
.fiches{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.6em}
.fiches button{padding:.36em 1em .4em;background:var(--room);color:var(--zwart);border:2px solid var(--room);border-radius:2em;font-weight:600;font-family:var(--display);letter-spacing:.04em;font-size:1.02em}
.fiches button.vast{box-shadow:0 0 0 .2em var(--vuur)}
.fiches button.klaar{background:transparent;color:var(--room2);border-style:dashed;border-color:rgba(243,227,198,.3);text-decoration:line-through}
#plekken{position:absolute;inset:0;pointer-events:none}
#plekken button{position:absolute;transform:translate(-50%,-50%);padding:.24em .8em .28em;background:rgba(14,9,7,.82);border:1.5px dashed var(--room);border-radius:2em;font-size:.84em;pointer-events:auto;transition:background .15s}
#plekken button:hover:not(:disabled){background:var(--purper)}
#plekken button.gevuld{background:var(--room);color:var(--zwart);border-style:solid;font-family:var(--display);font-size:1em;font-weight:600;letter-spacing:.04em}
#plekken button.schud{animation:schud .35s}
@keyframes schud{25%{transform:translate(-56%,-50%)}75%{transform:translate(-44%,-50%)}}

/* ---------- vensters ---------- */
#vensters{position:absolute;left:0;right:0;top:3em;display:flex;justify-content:center;gap:1.5em;padding:0 2em}
#vensters button{width:9.4em;background:none;border:0;padding:0;display:grid;justify-items:center;gap:.4em;transition:transform .2s,opacity .3s}
#vensters button:hover:not(:disabled){transform:translateY(-.3em)}
#vensters svg{width:7.2em;height:7.2em;display:block}
#vensters span{font-family:var(--display);font-size:.98em;letter-spacing:.03em;line-height:1.2}
#vensters button.open svg{filter:drop-shadow(0 0 .7em rgba(255,138,42,.7))}
#vensters button.dicht{opacity:.35}
#vensters button.gezien span::after{content:" ✓";color:var(--vuur)}
#venstertekst{position:absolute;left:8em;right:8em;top:12.5em;padding:.8em 1.2em;background:var(--room);color:var(--zwart);border-radius:.3em;font-size:.98em;line-height:1.45;border-left:.4em solid var(--purper);animation:in .3s}

/* ---------- start en einde ---------- */
.scherm{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,#2a1b13,#0c0806 70%);z-index:35;display:grid;grid-template-columns:27em 1fr;align-items:center;gap:1em;padding:0 3.4em}
.startbeeld svg{width:25em;height:25em;display:block}
.starttekst .boven{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:.8em;color:var(--klei)}
.starttekst h1{margin:.1em 0 .25em;font-family:var(--display);font-weight:400;font-size:4.3em;line-height:1.02;letter-spacing:.01em;color:var(--room)}
.starttekst .uitleg{font-size:1.12em;max-width:24em}
.starttekst .nodig{margin-top:.7em;color:var(--room2);font-size:.9em;max-width:24em}
.rij{display:flex;gap:.8em;margin-top:1.4em;flex-wrap:wrap}
.versie{margin-top:1.6em;font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,227,198,.38)}
.scherm .knop{padding:.6em 2.2em .64em;font-size:1.05em}
#einde{display:block;overflow:auto;padding:2em 4.5em 2.4em;grid-template-columns:none}
#einde h2{margin:0 0 .1em;font-family:var(--display);font-weight:400;font-size:2.5em}
#einde h3{margin:1.1em 0 .3em;font-family:var(--display);font-weight:400;font-size:1.02em;letter-spacing:.18em;text-transform:uppercase;color:var(--klei)}
#einde .kolommen{display:grid;grid-template-columns:1.25fr 1fr;gap:0 2.6em}
#einde ul{margin:0;padding-left:1.1em}
#einde li{margin:.28em 0;font-size:.9em}
#einde li b{color:var(--kleiL);font-weight:600}
#einde .klein{font-size:.74em;color:var(--room2);margin-top:1.4em}
#einde .lede{color:var(--room2);max-width:40em}

#rand{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:.3em;padding:.3em .5em;background:rgba(0,0,0,.85);z-index:50;font-size:.56em}
#rand.leerling{display:none}
#rand button{padding:.2em .6em;background:#241a14;border:1px solid #5a4636;border-radius:.3em;color:#d9c6a6}
#rand button.nu{background:var(--klei);color:#000}
