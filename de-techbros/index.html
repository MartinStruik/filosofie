or hulp en soms voor vrijheid. Mens en techniek raken verweven, zonder dat één plan alles bepaalt.`,`de mens als mengvorm van lichaam en techniek`,`Geen enkele richting overheerste: geen meter zakte onder de grens en geen keuzepatroon werd dominant.`]}var D={"musk-grok":{concept:`DATAÏSME`,scene:{speaker:`ONDERZOEKSJOURNALIST`,context:`Een journalist laat zien dat leerlingen discussies afsluiten met: “Grok zegt het, dus het klopt.” Ze vraagt je wat Harari's dataïsme hier betekent.`,prompt:`Welke uitleg klopt?`,answers:[{text:`Leerlingen vertrouwen de berekening van de bot meer dan hun eigen ervaring en oordeel. Zo maken ze een rekensysteem tot autoriteit over wat waar is.`,correct:!0,feedback:`Klopt. Bij Harari draait dataïsme om die verschuiving: de gegevensverwerking krijgt het laatste woord, niet het menselijke oordeel.`},{text:`Dataïsme betekent hier dat Grok zijn antwoorden haalt uit enorme hoeveelheden gegevens over wat mensen online schrijven en zoeken.`,correct:!1,feedback:`Dat beschrijft alleen hoe Grok werkt. Dataïsme gaat over vertrouwen: de berekening komt boven het eigen oordeel te staan.`},{text:`Grok legt de leerlingen vast in een profiel. Wat niet in hun opgeslagen gegevens past, raakt buiten beeld, en zo verliezen ze de vrijheid om te veranderen.`,correct:!1,feedback:`Dat raakt aan Rasch: profilering bedreigt het else, wat niet in een profiel past. Hier gaat het niet om een profiel, maar om het vertrouwen in de bot.`}]},hearing:{speaker:`SENATOR`,context:`Een gemeente laat een algoritme bepalen welke gezinnen extra worden gecontroleerd. Een ambtenaar twijfelt bij één gezin, maar krijgt te horen: “Het model heeft meer gegevens dan jij. Volg de score.”`,prompt:`Welk begrip beschrijft deze houding het best?`,answers:[{text:`DATAÏSME`,correct:!0,feedback:`Juist. De score krijgt meer gezag dan het oordeel van de ambtenaar, alleen omdat hij op meer gegevens rust.`},{text:`HET ELSE`,correct:!1,feedback:`Het else zou passen bij het gezin dat niet in de score past. De vraag gaat over de houding: de score volgen boven het eigen oordeel.`},{text:`BELICHAAMDE COGNITIE`,correct:!1,feedback:`Belichaamde cognitie gaat over de rol van het lichaam bij denken en ervaren. Daar zegt deze casus niets over.`}]}},"musk-neuralink":{concept:`EXTRAHUMANISME`,scene:{speaker:`MEDISCH-ETHISCHE COMMISSIE`,context:`De commissie vraagt of jouw implantaat voor verlamde patiënten al extrahumanisme is, zoals De Mul dat bedoelt.`,prompt:`Welk antwoord klopt?`,answers:[{text:`Een eerste stap. Het implantaat koppelt brein en computer: extrahumanisme. Het volle scenario, waarin gekoppelde mensen een zwermgeest vormen, is nog niet bereikt.`,correct:!0,feedback:`Klopt. Bij De Mul gaat extrahumanisme over technische onderdelen die mens en computer koppelen. De zwermgeest is het eindpunt van die ontwikkeling.`},{text:`Ja. Zodra je met techniek het biologische bouwplan van de mens verandert, spreekt De Mul van extrahumanisme, en een implantaat doet precies dat.`,correct:!1,feedback:`Dat is transhumanisme: biotechniek die het biologische bouwplan herschrijft. Een implantaat voegt een technisch onderdeel toe.`},{text:`Nee. Extrahumanisme gaat bij De Mul over kunstmatige levensvormen die de mens vervangen, zoals robots. Een implantaat in een levend mens valt daar dus buiten.`,correct:!1,feedback:`Dat is posthumanisme, De Muls zombie-scenario. Extrahumanisme gaat juist over mensen die technische onderdelen krijgen.`}]},hearing:{speaker:`SENATOR`,context:`Een start-up verkoopt koptelefoons met hersensensoren. Collega's zien elkaars concentratie en kunnen zonder te praten samen denken in één gedeelde digitale werkruimte.`,prompt:`Welk toekomstscenario van De Mul komt hier het dichtst bij?`,answers:[{text:`EXTRAHUMANISME`,correct:!0,feedback:`Juist. Techniek breidt mensen uit en koppelt hen aan elkaar: een eerste stap richting De Muls zwermgeest.`},{text:`TRANSHUMANISME`,correct:!1,feedback:`Transhumanisme gaat over het herschrijven van het biologische bouwplan, bijvoorbeeld met genetica. Hier blijft de biologie gelijk.`},{text:`POSTHUMANISME`,correct:!1,feedback:`Posthumanisme gaat over kunstmatige levensvormen die zonder mensen verder kunnen. Hier blijven de mensen zelf de denkers.`}]}},"musk-mars":{concept:`MORELE BEMIDDELING (VERBEEK)`,scene:{speaker:`MENSENRECHTENADVOCAAT`,context:`Een advocaat zegt: “Je dashboard toont alleen scores. Wie er mee mag, beslissen mensen toch zelf? Dan is de techniek neutraal.”`,prompt:`Wat zou Verbeek antwoorden?`,answers:[{text:`Het dashboard laat kandidaten verschijnen als risico of als nuttige kracht. Zo stuurt het mee hoe het morele oordeel uitvalt, ook al beslissen mensen formeel zelf.`,correct:!0,feedback:`Klopt. Volgens Verbeek is techniek nooit alleen een neutraal middel: ze bepaalt mee wat we zien en welke keuze voor de hand ligt. De mens blijft wel verantwoordelijk.`},{text:`Het dashboard verandert vooral hoe kandidaten zintuiglijk worden waargenomen: eerst voelt de score vreemd, daarna lijf je hem in en kijk je er vanzelf doorheen.`,correct:!1,feedback:`Dat is Kockelkorens decentreren en recentreren: waarneming. Verbeek gaat over het morele oordeel: wat wij goed of verantwoord vinden.`},{text:`De techniek is niet neutraal, want het dashboard beslist helemaal zelf wie er mee mag. Mensen voeren alleen uit, dus de verantwoordelijkheid ligt bij het systeem.`,correct:!1,feedback:`Te sterk. Bemiddeling is geen determinisme: mens en techniek komen samen tot een oordeel. Daarom kun jij je niet achter het dashboard verstoppen.`}]},hearing:{speaker:`SENATOR`,context:`Een app voor ouders geeft elke speeltuin een veiligheidsscore. Ouders die toch naar een speeltuin met een lage score gaan, voelen zich ineens onverantwoordelijk.`,prompt:`Welk begrip verklaart waarom die ouders zich zo voelen?`,answers:[{text:`MORELE BEMIDDELING (VERBEEK)`,correct:!0,feedback:`Juist. De app maakt speeltuinen zichtbaar als veilig of riskant en verandert zo wat ouders een verantwoorde keuze vinden.`},{text:`ZINTUIGLIJKE BEMIDDELING (KOCKELKOREN)`,correct:!1,feedback:`Kockelkoren gaat over hoe techniek onze waarneming verandert. Hier verandert vooral het morele oordeel van de ouders.`},{text:`STRUCTURALISME`,correct:!1,feedback:`Het structuralisme kijkt naar de rol die mensen in een groter systeem vervullen. Hier gaat het om hoe één techniek een morele keuze kleurt.`}]}},"musk-starlink":{concept:`NIET-BEWUSTE COGNITIE (HAYLES)`,scene:{speaker:`PARLEMENTAIRE ENQUÊTECOMMISSIE`,context:`Een commissielid zegt: “De drones herkennen doelen en verdelen zelf taken. Dan zijn de drones toch ook verantwoordelijk als het misgaat?”`,prompt:`Welk antwoord past bij Hayles?`,answers:[{text:`De drones verwerken informatie en passen hun gedrag aan. Mensen kunnen gekwetst worden en moeten verantwoordelijkheid nemen voor de gevolgen van het systeem.`,correct:!0,feedback:`Bij Hayles kan cognitie verdeeld zijn over mensen en machines. Menselijke kwetsbaarheid maakt verantwoordelijkheid tot een menselijke taak.`},{text:`Ja. Wie informatie verwerkt en keuzes maakt, denkt volgens Hayles net zoals een mens. De drones verdienen daarom dezelfde morele verantwoordelijkheid als soldaten.`,correct:!1,feedback:`Hayles maakt juist onderscheid: cognitie zonder bewustzijn is iets anders dan menselijk denken en moreel handelen.`},{text:`Deels. Volgens Hayles zijn de drones cognitieve systemen, en wie cognitief handelt, draagt ook een deel van de morele verantwoordelijkheid voor de gevolgen.`,correct:!1,feedback:`Cognitief handelen is bij Hayles nog geen moreel handelen. Daarvoor is bewust nadenken over waarden nodig, en dat kan een drone niet.`}]},hearing:{speaker:`SENATOR`,context:`Een sorteermachine in een pakketcentrum herkent adressen, merkt wanneer een band vastloopt en stuurt pakketten dan via een andere route. Niemand bedient haar, en ze ervaart niets.`,prompt:`Welk begrip beschrijft wat deze machine doet?`,answers:[{text:`NIET-BEWUSTE COGNITIE (HAYLES)`,correct:!0,feedback:`Juist. De machine verwerkt informatie en past haar gedrag aan, zonder bewustzijn of beleving.`},{text:`COGNITIEVE ASSEMBLAGE (HAYLES)`,correct:!1,feedback:`Bijna. Een assemblage is een samenwerkend geheel van mensen en machines. Hier gaat het om wat één machine zelf doet.`},{text:`BELICHAAMDE COGNITIE`,correct:!1,feedback:`Belichaamde cognitie gaat over hoe een levend lichaam meedoet aan denken en ervaren. Deze machine ervaart niets.`}]}},"musk-politics":{concept:`BELICHTEN EN VERHULLEN (LAKOFF & JOHNSON)`,scene:{speaker:`VERSLAGGEVER`,context:`Musk noemt X een dorpsplein. Een winkelier merkt op dat er op dit plein één eigenaar bepaalt wie een megafoon krijgt.`,prompt:`Wat doet het woord ‘dorpsplein’ hier?`,answers:[{text:`Het roept het vrije gesprek op en schuift de macht van de eigenaar naar de achtergrond.`,feedback:`De metafoor maakt een overeenkomst opvallend en andere eigenschappen minder zichtbaar.`,correct:!0},{text:`Het bewijst dat X toegankelijk is voor iedereen die iets wil zeggen.`,feedback:`Een vergelijking levert geen bewijs over de toegang tot een platform.`,correct:!1},{text:`Het vertelt ons vooral of de eigenaar goede bedoelingen heeft.`,feedback:`Het effect van het beeld kun je analyseren zonder te weten wat iemand bedoelde.`,correct:!1}]},hearing:{speaker:`SENATOR`,context:`Een school noemt leerlingen ‘klanten’. In de vergadering gaat het over tevredenheid en nauwelijks nog over samen leren. Wat doet de woordkeuze?`,prompt:`Welk begrip verklaart wat het woord ‘klanten’ doet?`,answers:[{text:`BELICHTEN EN VERHULLEN (LAKOFF & JOHNSON)`,feedback:`Het beeld van een klant zet sommige kenmerken van onderwijs op de voorgrond.`,correct:!0},{text:`DATAÏSME`,feedback:`Er wordt geen beslissing aan een berekening overgelaten.`,correct:!1},{text:`ZINTUIGLIJKE BEMIDDELING (KOCKELKOREN)`,feedback:`Hier richt een vergelijking de aandacht. Er is geen nieuw zintuiglijk hulpmiddel.`,correct:!1}]}},"musk-forever":{concept:`FUNCTIONALISME`,scene:{speaker:`NOTARIS`,context:`De notaris vraagt: “De Marskopie voert precies dezelfde denkfuncties uit als jij. Volgt uit het functionalisme dat hij jou ís, met recht op jouw bezit?”`,prompt:`Wat volgt uit het functionalisme zelf?`,answers:[{text:`Nee. Het functionalisme zegt dat dezelfde denkfuncties op ander materiaal kunnen draaien. Of het daarmee ook al dezelfde persoon is, is een aparte vraag over identiteit.`,correct:!0,feedback:`Klopt. Functionalisme maakt een denkende kopie denkbaar, maar beantwoordt niet of jouw bewustzijn is meegereisd naar Mars.`},{text:`Ja. Het functionalisme zegt dat je mentale leven uit functies bestaat. Draait hetzelfde patroon ergens anders, dan volgt daaruit dat het dezelfde persoon is.`,correct:!1,feedback:`Te snel. Dat volgt niet uit het functionalisme zelf. Daarvoor heb je een extra theorie over persoonlijke identiteit nodig, en daarover verschillen filosofen.`},{text:`Nee. Volgens het functionalisme kan denken alleen bestaan in hersenen van vlees en bloed. Een digitale kopie kan dus helemaal niet denken.`,correct:!1,feedback:`Precies andersom. Het functionalisme zegt juist dat het materiaal er niet toe doet: ook silicium zou kunnen denken.`}]},hearing:{speaker:`SENATOR`,context:`Een filosoof zegt: “Pijn is de rol die pijn speelt: een signaal van schade dat je laat terugtrekken. Of dat in neuronen of in siliciumchips gebeurt, maakt niet uit.”`,prompt:`Welke opvatting verdedigt deze filosoof?`,answers:[{text:`FUNCTIONALISME`,correct:!0,feedback:`Juist. Een mentale toestand wordt bepaald door wat hij doet, niet door het materiaal dat hem uitvoert.`},{text:`BELICHAAMDE COGNITIE`,correct:!1,feedback:`Belichaamde cognitie benadrukt juist dat het lichaam ertoe doet. Deze filosoof zegt dat het materiaal niet uitmaakt.`},{text:`POSTHUMANISME`,correct:!1,feedback:`Posthumanisme gaat over kunstmatige levensvormen die mensen veranderen of vervangen. Deze filosoof doet een uitspraak over wat pijn is.`}]}},"altman-chat":{concept:`PRODUCT- EN PROCESSIMULATIE`,scene:{speaker:`RECLAME CODE COMMISSIE`,context:`Een reclamemaker wil ‘denkt net als een mens’ op een poster zetten. Als bewijs laat ze zien dat de chatbot en een mens hetzelfde antwoord geven.`,prompt:`Welk antwoord klopt?`,answers:[{text:`Dat mag niet zomaar. Dezelfde antwoorden geven is productsimulatie. Dat het systeem ook op dezelfde manier denkt, processimulatie, is daarmee niet aangetoond.`,correct:!0,feedback:`Klopt. Hetzelfde resultaat bewijst niet hetzelfde proces. Dreyfus wijst erop dat menselijk denken leunt op een lichaam en ervaring die de computer mist.`},{text:`Dat mag. Als het eindresultaat niet van een mens te onderscheiden is, is dat een sterke aanwijzing dat het systeem ook op een menselijke manier tot zijn antwoorden komt.`,correct:!1,feedback:`Dat is de denkfout die het onderscheid blootlegt. Uit hetzelfde product volgt niet hetzelfde proces, ook niet als aanwijzing.`},{text:`Dat mag niet. Een computer kan zelfs geen productsimulatie leveren: zonder lichaam kan hij nooit een antwoord geven dat op een menselijk antwoord lijkt.`,correct:!1,feedback:`Te sterk. Je chatbot lévert overtuigende antwoorden; productsimulatie lukt dus wel. De vraag is of het proces erachter menselijk is.`}]},hearing:{speaker:`SENATOR`,context:`Een schaakcomputer verslaat de wereldkampioen. Hij rekent miljoenen stellingen per seconde door, terwijl de kampioen vooral in één oogopslag “ziet” welke zet goed is.`,prompt:`Welk onderscheid helpt het verschil tussen computer en kampioen te benoemen?`,answers:[{text:`PRODUCT- EN PROCESSIMULATIE`,correct:!0,feedback:`Juist. Het resultaat (een winnende zet) is hetzelfde, maar de weg ernaartoe is totaal anders.`},{text:`IS EN OUGHT`,correct:!1,feedback:`Is en ought gaat over de sprong van feiten naar normen. Hier gaat het om twee manieren om tot hetzelfde resultaat te komen.`},{text:`UITGEBREID DENKEN (EXTENDED)`,correct:!1,feedback:`Extended cognition gaat over hulpmiddelen die deel worden van iemands denken. De computer is hier een tegenstander, geen hulpmiddel.`}]}},"altman-promise":{concept:`IS EN OUGHT`,scene:{speaker:`MINISTER VAN DIGITALE ZAKEN`,context:`Een investeerder zegt dat AI straks slimmer wordt dan alle experts samen en dat de makers daarom de regels voor AI moeten schrijven.`,prompt:`Welk antwoord klopt?`,answers:[{text:`Er ontbreekt een normatieve stap. Uit een bewering over wat er gebeurt, volgt niet vanzelf wie er mag beslissen. Daarvoor is ook een argument over waarden nodig.`,correct:!0,feedback:`Klopt. Van is (de AI wordt slimmer) kom je niet zonder extra argument bij ought (dus moeten wij beslissen).`},{text:`Er ontbreekt bewijs. Als je met harde cijfers aantoont dat de AI echt slimmer wordt, is daarmee ook onderbouwd dat jouw bedrijf de regels maakt.`,correct:!1,feedback:`Meer feiten overbruggen de kloof niet. Ook een bewezen feit zegt nog niet wie er hoort te beslissen.`},{text:`Het argument faalt vooral omdat de voorspelling onzeker is. Zolang niemand weet of AI echt slimmer wordt dan experts, kan de conclusie niet kloppen.`,correct:!1,feedback:`Dit klinkt kritisch, maar mist het punt. Zelfs als de voorspelling zeker was, volgt de conclusie nog niet.`}]},hearing:{speaker:`SENATOR`,context:`Een sport-app meet dat je minder stappen zet dan gemiddeld. De app concludeert: “Je moet dus vanaf morgen tienduizend stappen per dag zetten.”`,prompt:`Welk begrip of begrippenpaar laat zien wat er mis is met deze conclusie?`,answers:[{text:`IS EN OUGHT`,correct:!0,feedback:`Juist. Uit een meting (is) volgt niet vanzelf een plicht (ought). Daarvoor is een normatieve premisse nodig, bijvoorbeeld dat je je gezondheid hoort te bevorderen.`},{text:`PRODUCT- EN PROCESSIMULATIE`,correct:!1,feedback:`Dat onderscheid gaat over hetzelfde resultaat geven of ook op dezelfde manier denken. Het zegt niets over de sprong van een meting naar een plicht.`},{text:`ZINTUIGLIJKE BEMIDDELING (KOCKELKOREN)`,correct:!1,feedback:`Kockelkoren gaat over hoe techniek onze waarneming verandert. De fout zit hier in de redenering, niet in de waarneming.`}]}},"altman-coup":{concept:`ACTOR-NETWERKTHEORIE`,scene:{speaker:`BESTUURSKUNDIGE`,context:`Een bestuurskundige zegt: “Volgens de regels had het bestuur alle macht. Toch kwam na jouw ontslag alles in beweging: werknemers, Microsoft, investeerders. Dat komt door jouw genialiteit.”`,prompt:`Hoe zou Latour dit verklaren?`,answers:[{text:`Niet één leider bepaalde de uitkomst, maar een netwerk: werknemers, Microsoft, investeerders, geld en techniek duwden samen. Die verbindingen bleken sterker dan de regels op papier.`,correct:!0,feedback:`Klopt. Latour ziet geen eenzame held, maar een netwerk van mensen en dingen. Wie welke verbinding gebruikt, blijft wel verantwoordelijk.`},{text:`Latour zou de bestuurskundige gelijk geven. Macht komt voort uit de wil en het talent van één persoon; het netwerk eromheen volgt uiteindelijk alleen de sterkste leider.`,correct:!1,feedback:`Precies het idee dat Latour bestrijdt. Macht zit niet in één persoon, maar in de verbindingen tussen mensen en dingen.`},{text:`Latour zou wijzen op de statuten: die waren zwak geschreven. Met betere regels op papier had het bestuur de macht gehouden.`,correct:!1,feedback:`Voor Latour zijn regels op papier maar één schakel in het netwerk. Zonder steun van mensen, geld en techniek verliezen ze het van sterkere verbindingen.`}]},hearing:{speaker:`SENATOR`,context:`Bij een basisschool ligt een verkeersdrempel. Automobilisten remmen af, ook als er geen agent is. De drempel “handhaaft” de regel.`,prompt:`Welk begrip past bij dit voorbeeld?`,answers:[{text:`ACTOR-NETWERKTHEORIE`,correct:!0,feedback:`Juist. De drempel neemt de taak van de agent over: Latour noemt dat delegatie. Een ding handelt mee.`},{text:`ZINTUIGLIJKE BEMIDDELING (KOCKELKOREN)`,correct:!1,feedback:`Kockelkoren gaat over hoe techniek onze waarneming verandert. De drempel verandert niet wat je ziet, maar wat je doet.`},{text:`DYNAMISCH APPARAAT (CLARK)`,correct:!1,feedback:`Een dynamisch apparaat leert over zijn gebruiker. De drempel leert niets; hij ligt er gewoon.`}]}},"altman-orb":{concept:`HET ELSE`,scene:{speaker:`PRIVACYTOEZICHTHOUDER`,context:`Stel dat de oogscan de enige toegangspas wordt. Een toezichthouder zegt dat zo’n scan heel nauwkeurig kan zijn. Wat raakt uit beeld als de scan bepaalt wie meetelt?`,prompt:`Welk antwoord past bij Rasch?`,answers:[{text:`Het gaat niet om nauwkeurigheid. Een systeem dat mensen volledig vastlegt, laat geen ruimte voor weigeren of veranderen. Dat onmeetbare noemt Rasch het else.`,correct:!0,feedback:`Klopt. Hoe preciezer de meting, hoe kleiner de ruimte voor het else: weigeren, anders zijn, veranderen. Voor Rasch is dat een vorm van vrijheid.`},{text:`Het probleem is dat de scan vaker fouten maakt bij sommige groepen mensen. Het else is volgens Rasch die foutmarge: mensen die het systeem verkeerd inschat.`,correct:!1,feedback:`Andersom. Het else is geen meetfout. Ook een perfecte meting vangt niet wat een mens nog kan worden of weigeren.`},{text:`Het probleem is dat AI-bots de scan kunnen vervalsen. Het else is volgens Rasch het deel van een systeem dat kwaadwillenden ongemerkt kunnen misbruiken.`,correct:!1,feedback:`Klinkt kritisch, maar dit is niet wat Rasch bedoelt. Het else gaat over wat een mens is buiten het profiel, niet over hackers.`}]},hearing:{speaker:`SENATOR`,context:`Een streamingdienst kent je smaak zo goed dat hij weet wat je volgende week wilt zien. Toch kies je ineens een Japanse documentaire over bijen, die nergens in je profiel past.`,prompt:`Welk begrip past bij jouw onverwachte keuze?`,answers:[{text:`HET ELSE`,correct:!0,feedback:`Juist. Je keuze valt buiten het profiel. Volgens Rasch is die onvoorspelbaarheid geen fout, maar vrijheid.`},{text:`DATAÏSME`,correct:!1,feedback:`Dataïsme beschrijft het vertrouwen in de voorspelling. Jouw keuze laat juist zien wat die voorspelling mist.`},{text:`NIET-BEWUSTE COGNITIE (HAYLES)`,correct:!1,feedback:`Het aanbevelingssysteem heeft misschien niet-bewuste cognitie, maar de vraag gaat over jouw keuze buiten het profiel.`}]}},"altman-device":{concept:`DYNAMISCH APPARAAT (CLARK)`,scene:{speaker:`CONSUMENTENAUTORITEIT`,context:`Otto schrijft afspraken in een boekje en zoekt ze later op. Stel dat een apparaat leert wanneer je afspraken vergeet en zijn herinneringen daarop afstemt.`,prompt:`Wat maakt dit apparaat volgens Clark anders dan Otto’s boekje?`,answers:[{text:`Bij het notitieboekje past alleen de mens zich aan het ding aan. Een dynamisch apparaat leert zelf ook over de gebruiker en verandert zijn eigen werking mee.`,correct:!0,feedback:`Klopt. Het verschil zit in de wederkerigheid: mens en apparaat passen zich aan elkaar aan. Zo wordt de cyborgverbinding hechter.`},{text:`Het nieuwe is dat je het apparaat vaker gebruikt en meer vertrouwt dan een boekje. Daardoor wordt het sneller een vanzelfsprekend deel van je denken.`,correct:!1,feedback:`Vaker gebruik en vertrouwen maken iets deel van je denken (extended mind). Een dynamisch apparaat leert daarnaast zelf over jou en verandert mee.`},{text:`Nieuw is dat het apparaat dicht op het lichaam zit. Volgens Clark word je pas een cyborg als techniek onder de huid gaat, zoals bij een implantaat.`,correct:!1,feedback:`Andersom. Volgens Clark zijn we natural-born cyborgs, ook zonder implantaat. Taal en notitieboekjes tellen al mee.`}]},hearing:{speaker:`SENATOR`,context:`Een slimme thermostaat leert wanneer Moniek thuiskomt en past zijn schema daarop aan. Moniek volgt intussen steeds vaker zijn tips en gaat anders stoken. Na een jaar weet niemand meer wie zich aan wie heeft aangepast.`,prompt:`Welk begrip beschrijft deze wederzijdse aanpassing het best?`,answers:[{text:`DYNAMISCH APPARAAT (CLARK)`,correct:!0,feedback:`Juist. Het apparaat leert over de gebruiker en verandert mee, terwijl de gebruiker zich aan het apparaat aanpast.`},{text:`UITGEBREID DENKEN (EXTENDED)`,correct:!1,feedback:`Bijna. Extended cognition vraagt of een hulpmiddel deel wordt van het denken. Hier gaat het om twee kanten die zich aan elkaar aanpassen.`},{text:`ZINTUIGLIJKE BEMIDDELING (KOCKELKOREN)`,correct:!1,feedback:`Kockelkoren gaat over hoe techniek je waarneming verandert. De thermostaat verandert gewoonten, niet wat Moniek waarneemt.`}]}},"altman-forever":{concept:`TRANSHUMANISME`,scene:{speaker:`MEDICIJNAUTORITEIT`,context:`Een investeerder hoort ‘onderzoek naar ouderdomsziekten’ en roept meteen ‘transhumanisme!’.`,prompt:`Welk antwoord klopt?`,answers:[{text:`Niet vanzelf. Een middel dat alleen ziekten remt, herschrijft het bouwplan niet. Een ingreep die het verouderingsproces zelf verandert, komt wel in de buurt.`,correct:!0,feedback:`Klopt. Niet elke behandeling tegen ouderdom is transhumanistisch. Het gaat om ingrijpen in het bouwplan, met levensvormen voorbij de huidige mens als mogelijk gevolg.`},{text:`Ja. Volgens De Mul is medische techniek die het leven verlengt transhumanisme, ook een vaccin of een pacemaker.`,correct:!1,feedback:`Te breed. Dan zou alle geneeskunde transhumanisme zijn. De Mul bedoelt een ingrijpende verandering van het biologische bouwplan.`},{text:`Nee. Transhumanisme betekent bij De Mul dat mensen technische onderdelen krijgen, zoals implantaten in hun hersenen die hen met computers en ook met elkaar verbinden.`,correct:!1,feedback:`Dat is extrahumanisme. Transhumanisme gaat bij De Mul over biotechniek die het bouwplan zelf verandert.`}]},hearing:{speaker:`SENATOR`,context:`Stel dat mensen hun biologische bouwplan voor volgende generaties kunnen veranderen. Hun nakomelingen krijgen eigenschappen die de huidige mens niet heeft.`,prompt:`Welk toekomstscenario van De Mul past hierbij?`,answers:[{text:`TRANSHUMANISME`,correct:!0,feedback:`Juist. Biotechniek herschrijft het bouwplan zelf. Op termijn ontstaat zo een levensvorm voorbij de huidige mens.`},{text:`EXTRAHUMANISME`,correct:!1,feedback:`Extrahumanisme voegt technische onderdelen toe, zoals implantaten. Hier verandert de biologie zelf.`},{text:`POSTHUMANISME`,correct:!1,feedback:`Posthumanisme gaat over kunstmatige, niet-biologische levensvormen. Deze nieuwe mensen zijn nog steeds biologisch.`}]}},"zuck-feed":{concept:`VRIJHEID ALS JE-VERHOUDEN (VERBEEK)`,scene:{speaker:`NOOR, 17 JAAR`,context:`Mijn tijdlijn kiest wat bovenaan staat. Ik zou willen kunnen zien waarom, en er zelf iets aan veranderen.`,prompt:`Welke instelling geeft Noor die ruimte?`,answers:[{text:`Laat Noor de volgorde aanpassen en zelf een stoppunt kiezen.`,feedback:`Ze kan zo een eigen houding aannemen tegenover de manier waarop de app haar stuurt.`,correct:!0},{text:`Laat de app haar ideale kijktijd uitrekenen en automatisch afsluiten.`,feedback:`Dat kan haar helpen, maar de app houdt hier zelf het laatste woord.`,correct:!1},{text:`Toon alleen berichten die ze eerder leuk vond.`,feedback:`Dat volgt haar eerdere gedrag. Het geeft haar nog geen greep op de selectie.`,correct:!1}]},hearing:{speaker:`SENATOR`,context:`Een fietser bekijkt de voorgestelde route, ontdekt dat ‘snelst’ staat ingesteld en kiest voortaan zelf voor rustige straten.`,prompt:`Welk idee over vrijheid zie je hier?`,answers:[{text:`VRIJHEID ALS JE-VERHOUDEN (VERBEEK)`,feedback:`De fietser gebruikt de routeplanner en bepaalt hoe het advies meetelt.`,correct:!0},{text:`DATAÏSME`,feedback:`De fietser onderzoekt en verandert de norm achter het advies.`,correct:!1},{text:`DYNAMISCH APPARAAT (CLARK)`,feedback:`De fietser verandert de instelling. Het systeem leert hier zelf niets.`,correct:!1}]}},"zuck-metaverse":{concept:`BELICHAAMDE COGNITIE`,scene:{speaker:`BEURSANALIST`,context:`Een analist vraagt waarom Horizon zo weinig vaste gebruikers trekt. “Ligt het gewoon aan de beelden, die nog niet scherp genoeg zijn?”`,prompt:`Welk antwoord past bij belichaamde cognitie?`,answers:[{text:`Niet alleen. Je ervaart een wereld via je lichaam: evenwicht, vermoeidheid, beweging. Scherpere beelden lossen niet op dat wat je ziet niet klopt met wat je lichaam voelt.`,correct:!0,feedback:`Klopt. Denken en ervaren hangen samen met wat je lichaam kan. Een wereld die het lichaam negeert, voelt niet als een plek om te wonen.`},{text:`Grotendeels wel. Ervaren is vooral het verwerken van zintuiglijke informatie, dus scherpere beelden, beter geluid en snellere chips maken de virtuele wereld steeds echter.`,correct:!1,feedback:`Dat is het beeld van de geest als losse informatieverwerker. Belichaamde cognitie zegt juist dat het lichaam meedoet.`},{text:`Nee, het probleem is dat de avatars geen lichaam hebben. Belichaamde cognitie gaat erover of een avatar zelf iets kan ervaren in de virtuele wereld.`,correct:!1,feedback:`Het gaat om de gebruiker, niet om de avatar. Jouw echte lichaam bepaalt hoe de virtuele wereld aanvoelt.`}]},hearing:{speaker:`SENATOR`,context:`Een topschaatser legt uit dat ze een bocht niet uitrekent. Haar benen, haar evenwicht en jaren training laten haar voelen wanneer ze moet overstappen.`,prompt:`Welk begrip past bij haar uitleg?`,answers:[{text:`BELICHAAMDE COGNITIE`,correct:!0,feedback:`Juist. Haar kennis zit in haar lichaam en zijn mogelijkheden, niet in een berekening in haar hoofd.`},{text:`FUNCTIONALISME`,correct:!1,feedback:`Functionalisme zegt dat het materiaal er niet toe doet. De schaatser zegt juist dat haar lichaam alles uitmaakt.`},{text:`DATAÏSME`,correct:!1,feedback:`Dataïsme gaat over vertrouwen in gegevensverwerking. De schaatser vertrouwt op haar lichaam, niet op data.`}]}},"zuck-rayban":{concept:`ZINTUIGLIJKE BEMIDDELING (KOCKELKOREN)`,scene:{speaker:`CONSUMENTENPROGRAMMA`,context:`Een verslaggever zegt: “Na een week zag ik de pijlen en labels in de bril niet eens meer. Ze waren gewoon deel van wat ik zag.” Ze vraagt wat daar gebeurde.`,prompt:`Welke uitleg klopt volgens Kockelkoren?`,answers:[{text:`Eerst haalde de bril je uit je vertrouwde manier van kijken: decentrering. Daarna leerde je ermee waarnemen en lijfde je hem in: recentrering.`,correct:!0,feedback:`Klopt. Eerst vreemd, daarna vanzelfsprekend. Juist daardoor kan Meta's selectie van de wereld ongemerkt normaal worden.`},{text:`Je bent eraan gewend geraakt, zoals aan een nieuwe bril op sterkte. Recentrering betekent dat je weer kijkt zoals vroeger, alleen wat scherper.`,correct:!1,feedback:`Recentrering is geen terugkeer. Je neemt weer ontspannen waar, maar wel mét de bril. Je blik is blijvend veranderd.`},{text:`Eerst lijfde je de bril in: decentrering. Daarna ging je hem weer bewust zien: recentrering. Daarom zag je de labels na een week niet meer.`,correct:!1,feedback:`De begrippen zijn omgedraaid. Decentrering is de eerste vervreemding, recentrering het inlijven.`}]},hearing:{speaker:`SENATOR`,context:`Toen de eerste treinen reden, werden reizigers misselijk van het voorbijflitsende landschap. Een paar generaties later kijken mensen ontspannen naar buiten en vinden ze het uitzicht juist mooi.`,prompt:`Welk begrip beschrijft deze verandering?`,answers:[{text:`ZINTUIGLIJKE BEMIDDELING (KOCKELKOREN)`,correct:!0,feedback:`Juist. Eerst decentrering, daarna recentrering: mensen leerden met de trein waarnemen. Dit is Kockelkorens eigen voorbeeld.`},{text:`MORELE BEMIDDELING (VERBEEK)`,correct:!1,feedback:`Verbeek gaat over het morele oordeel. Hier verandert vooral hoe mensen waarnemen.`},{text:`EXTRAHUMANISME`,correct:!1,feedback:`Extrahumanisme gaat over technische uitbreiding van het menselijk lichaam en brein. Een trein wordt geen deel van je lichaam.`}]}},"zuck-politics":{concept:`STRUCTURALISME`,scene:{speaker:`COLUMNIST`,context:`Een columnist schrijft: “Community Notes geeft gebruikers eindelijk vrijheid: iedereen mag nu zelf controleren wat waar is.”`,prompt:`Wat zou een structuralist hierop zeggen?`,answers:[{text:`Gebruikers krijgen vooral een nieuwe rol in het systeem: onbetaalde controleur. Die rol vormt hun gedrag mee, ook als het voelt als een vrije keuze.`,correct:!0,feedback:`Klopt. Het structuralisme ziet mensen als functionele onderdelen van een groter systeem. Hun gevoel van vrijheid zegt weinig over wie hun gedrag vormt.`},{text:`Dat dit eigenlijk functionalisme is: de hersenen van gebruikers werken als een computer die berichten controleert, los van het materiaal dat het werk doet.`,correct:!1,feedback:`Verwarring. Functioneel in het structuralisme betekent: een rol in een systeem. Functionalisme gaat over hoe denkprocessen werken.`},{text:`Dat alleen Zuckerberg vrij is. Hij heeft de structuur bedacht en staat erboven; de gebruikers zitten in het systeem, maar hij zelf niet.`,correct:!1,feedback:`Ook de baas is een onderdeel van een groter systeem. Zijn regels draaien mee met de politiek; dat zag je bij de MAGA-draai.`}]},hearing:{speaker:`SENATOR`,context:`Een bezorger van een maaltijdapp zegt dat hij zijn eigen baas is. Toch rijdt hij steeds sneller, omdat de app hem met betere ritten beloont als hij binnen tien minuten levert.`,prompt:`Welk begrip helpt zijn situatie te begrijpen?`,answers:[{text:`STRUCTURALISME`,correct:!0,feedback:`Juist. Zijn rol in het systeem van de app vormt zijn gedrag, ook al voelt hij zich vrij.`},{text:`DATAÏSME`,correct:!1,feedback:`Dataïsme gaat over vertrouwen in data boven het eigen oordeel. Hij gelooft niet dat de app beter weet; beloningen sturen hem in een rol.`},{text:`FUNCTIONALISME`,correct:!1,feedback:`Niet verwarren: functionalisme gaat over denkprocessen. Hier gaat het om de functie die de bezorger in een systeem vervult.`}]}},"zuck-forever":{concept:`POSTHUMANISME`,scene:{speaker:`ETHICUS IN EEN TALKSHOW`,context:`Een ethicus zegt: “Die avatar is toch gewoon een kopie van jou? Dan is dit geen posthumanisme.”`,prompt:`Welk antwoord klopt?`,answers:[{text:`Zolang hij alleen nabootst, klopt dat. Maar deze avatar ontwikkelt zich zelfstandig verder en kan zo een kunstmatige levensvorm worden: richting posthumanisme.`,correct:!0,feedback:`Klopt. De Mul spreekt van posthumanisme als kunstmatige systemen zich ontwikkelen tot een eigen levensvorm die de mens niet meer nodig heeft. Deze avatar is een stap die kant op.`},{text:`Het blijft een kopie. Posthumanisme betekent bij De Mul dat het menselijk lichaam met technische onderdelen wordt uitgebreid, en dat gebeurt hier niet.`,correct:!1,feedback:`Dat is extrahumanisme. Posthumanisme gaat over kunstmatige levensvormen die zelfstandig naast of zonder mensen bestaan.`},{text:`Het is posthumanisme omdat de avatar jouw gegevens gebruikt. Bij De Mul is elk systeem dat op grote schaal met menselijke data werkt al een postbiologische levensvorm.`,correct:!1,feedback:`Te breed. Data gebruiken maakt iets nog geen levensvorm. Het gaat om een kunstmatig wezen dat zich zelfstandig tot een eigen levensvorm ontwikkelt.`}]},hearing:{speaker:`SENATOR`,context:`In een toekomstverhaal bouwen robots fabrieken die nieuwe robots maken. Ze verbeteren hun eigen ontwerp en vormen een samenleving die geen mensen meer nodig heeft.`,prompt:`Welk toekomstscenario van De Mul past hierbij?`,answers:[{text:`POSTHUMANISME`,correct:!0,feedback:`Juist. Robotica en AI brengen een kunstmatige levensvorm voort die mensen kan overtreffen of vervangen: het zombie-scenario.`},{text:`TRANSHUMANISME`,correct:!1,feedback:`Transhumanisme gaat over biologische mensen met een herschreven bouwplan. Deze robots zijn niet biologisch.`},{text:`EXTRAHUMANISME`,correct:!1,feedback:`Extrahumanisme gaat over mensen die technisch worden uitgebreid. Hier zijn er geen mensen meer bij.`}]}},"musk-pager":{concept:`DERDEPERSOONSKRITIEK (DESPRET)`,scene:{speaker:`DIERVERZORGER`,context:`Pager scoort goed bij Pong. De onderzoeker schrijft op dat Pager het spel dus graag speelt.`,prompt:`Wat zou Despret de onderzoeker vragen?`,answers:[{text:`Wat doet Pager als hij zelf mag beginnen of stoppen, en hoe reageert hij op jou?`,feedback:`Je onderzoekt wat voor het dier telt en hoe jullie relatie de uitkomst vormt.`,correct:!0},{text:`Hoeveel potjes zijn nodig om zijn gemiddelde score betrouwbaar te meten?`,feedback:`Meer scores vertellen je nog weinig over wat het spel voor Pager betekent.`,correct:!1},{text:`Zou een mens bij deze score plezier hebben?`,feedback:`Daarmee vul je Pagers ervaring in vanuit je eigen perspectief.`,correct:!1}]},hearing:{speaker:`SENATOR`,context:`Een hond werkt bij de ene onderzoeker graag mee en bij de andere nauwelijks. Het rapport noemt hem lui en laat beide onderzoekers buiten beeld.`,prompt:`Welk begrip helpt je dit te verklaren?`,answers:[{text:`DERDEPERSOONSKRITIEK (DESPRET)`,feedback:`De relatie met de onderzoeker verdwijnt uit de verklaring van het gedrag.`,correct:!0},{text:`FUNCTIONALISME`,feedback:`Hier verschilt de onderzoekssituatie, niet het materiaal waarin een functie werkt.`,correct:!1},{text:`DATAÏSME`,feedback:`De vraag gaat over de vergeten rol van de waarnemer.`,correct:!1}]}},"altman-stargate":{concept:`MESH (MORTON)`,scene:{speaker:`BUUR VAN DE REKENFABRIEK`,context:`Op de bouwtekening staat de rekenhal keurig binnen het hek. In de rivier verderop verandert de temperatuur.`,prompt:`Waarom zou Morton de rivier op de tekening willen zien?`,answers:[{text:`Chips, koelwater, vissen en dorpen zijn met elkaar verweven. Het hek geeft alleen het terrein aan.`,feedback:`De mesh omvat levende en niet-levende dingen. De eigenaar staat er zelf middenin.`,correct:!0},{text:`De rivier telt mee zodra de eigenaar er geld mee verdient.`,feedback:`Ook wat niemand bezit of verkoopt, maakt deel uit van de verwevenheid.`,correct:!1},{text:`Met genoeg sensoren kan één bestuurder de hele omgeving overzien en beheersen.`,feedback:`In Mortons mesh heeft niemand zo’n centraal overzicht.`,correct:!1}]},hearing:{speaker:`SENATOR`,context:`Een trui verbindt schapen, gras, verf, rivierwater en de huid van de drager. Waar het verhaal begint hangt af van waar je instapt.`,prompt:`Welk begrip helpt je dit te verklaren?`,answers:[{text:`MESH (MORTON)`,feedback:`De relaties lopen in alle richtingen door, ook buiten wat de drager ziet.`,correct:!0},{text:`COGNITIEVE ASSEMBLAGE (HAYLES)`,feedback:`Samen informatie verwerken staat hier niet centraal.`,correct:!1},{text:`DATAÏSME`,feedback:`Niemand beweert hier dat alles in gegevens te vangen is.`,correct:!1}]}},"zuck-emoji":{concept:`INTRA-ACTIE (BARAD)`,scene:{speaker:`DATA-ANALIST`,context:`Een boze klik telt extra zwaar. Boze berichten komen zo vaker in beeld en krijgen weer boze klikken.`,prompt:`Wat meet de grafiek volgens Barad?`,answers:[{text:`Hoe boosheid verschijnt in een systeem dat haar zelf helpt vormen.`,feedback:`De knop, de rangorde en de gebruikers brengen samen de gemeten boosheid voort.`,correct:!0},{text:`Hoe boos de gebruikers vooraf al waren. De knop maakt tellen makkelijker.`,feedback:`Wie vaker boze berichten ziet, krijgt ook vaker aanleiding om boos te reageren.`,correct:!1},{text:`Hoe de programmeur zich voelde toen die de knop ontwierp.`,feedback:`De uitkomst ontstaat in het gebruik. De bedoeling van één ontwerper verklaart haar niet.`,correct:!1}]},hearing:{speaker:`SENATOR`,context:`Een school meet inzet aan het aantal opgestoken vingers. Leerlingen steken nu ook hun hand op als ze niets willen zeggen. De school noemt dat groeiende inzet.`,prompt:`Welk begrip helpt je dit te verklaren?`,answers:[{text:`INTRA-ACTIE (BARAD)`,feedback:`Wat als inzet verschijnt krijgt vorm door de manier van meten.`,correct:!0},{text:`DATAÏSME`,feedback:`Gezag van cijfers speelt mee. Hier gaat het specifiek om hoe de meting haar eigen uitkomst vormt.`,correct:!1},{text:`BELICHAAMDE COGNITIE`,feedback:`De vraag draait om de meetpraktijk, niet om hoe je lichaam bijdraagt aan denken.`,correct:!1}]}},"zuck-realname":{concept:`CYBORG (HARAWAY)`,scene:{speaker:`DRAGARTIEST`,context:`Op het podium en thuis word ik anders genoemd. Mijn vrienden kennen beide namen.`,prompt:`Wat maakt de eis van één echte naam problematisch voor Haraway?`,answers:[{text:`Het platform kiest één vorm van identiteit als norm. Wie meerdere rollen tegelijk leeft, kan buiten de boot vallen.`,feedback:`De cyborg is bij Haraway een grensfiguur. Een identiteit mag samengesteld zijn.`,correct:!0},{text:`Met twee namen weet het systeem nog te weinig om de juiste te kiezen.`,feedback:`Meer gegevens lossen de aanname dat er één juiste identiteit is niet op.`,correct:!1},{text:`De artiest is pas een cyborg zodra er een chip in diens lichaam zit.`,feedback:`Haraway gebruikt de cyborg ook om vaste grenzen van identiteit te onderzoeken.`,correct:!1}]},hearing:{speaker:`SENATOR`,context:`Een muzikant treedt tegelijk op met haar stem, een kunstarm en een digitale dubbelganger. Ze vraagt waarom het festival haar als óf mens óf machine wil inschrijven.`,prompt:`Welk begrip helpt je dit te verklaren?`,answers:[{text:`CYBORG (HARAWAY)`,feedback:`De muzikant stelt de grens ter discussie waarmee het festival haar identiteit wil vastleggen.`,correct:!0},{text:`DYNAMISCH APPARAAT (CLARK)`,feedback:`De casus vertelt niet dat het apparaat leert van de muzikant.`,correct:!1},{text:`FUNCTIONALISME`,feedback:`De kwestie is de opgelegde indeling, niet of twee systemen dezelfde functie uitvoeren.`,correct:!1}]}}};function O(e){let t=[...e];for(let e=t.length-1;e>0;e--){let n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}return t}function he(e){let t=e.filter(e=>e.phase===`scene`),n=t.filter(e=>!e.answer.correct).reverse(),r=O(t.filter(e=>e.answer.correct));return[...n,...r].slice(0,3).map(e=>e.sceneId)}function ge(e,t,n,r,i){if(e.some(e=>e.sceneId===t&&e.phase===n))return e;let a=e.find(e=>e.phase===`scene`&&e.sceneId===t),o=e.filter(e=>!e.answer.correct).length,s=[3,6,12,20][Math.min(3,o)]+Math.round(i*.15),c=r.correct?n===`hearing`?-(a?.change??0):0:-Math.min(s,i);return[...e,{sceneId:t,phase:n,answer:r,change:c}]}var _e=e((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),k=e(((e,t)=>{t.exports=_e()}))(),A=e=>e,ve={GEDOCUMENTEERD:`ECHT`,TOEKOMSTSCENARIO:`VERZONNEN`,INTERPRETATIE:`FEIT + DUIDING`},ye=[{title:`VERDEEL DE KNOPPEN`,subtitle:`Trump de politiek, Musk het bereik, Zuckerberg de profielen, Altman de antwoorden.`,resultTitle:`NIEMAND HEEFT ALLE MACHT. SAMEN HEBBEN ZE BIJNA ALLES.`,outcome:`Er is geen geheime baas nodig. De systemen sluiten op elkaar aan en burgers weten niet meer bij welk loket ze bezwaar maken.`,concept:`COGNITIEVE ASSEMBLAGE (HAYLES)`,definition:`Hayles: in een cognitieve assemblage zijn denkprocessen verdeeld over mensen en niet-mensen. Platforms en AI beslissen mee. De verantwoordelijkheid blijft menselijk: machines kennen geen kwetsbaarheid.`},{title:`NOEM HET EFFICIËNT BESTUUR`,subtitle:`Laat algoritmes sneller beslissen dan parlementen en rechters.`,resultTitle:`DE DEMOCRATIE IS NIET AFGESCHAFT. ZE IS TE TRAAG GEMAAKT.`,outcome:`Verkiezingen blijven bestaan. De belangrijke keuzes zijn dan al verwerkt in de app en het AI-advies.`,concept:`DATAÏSME`,definition:`Harari: in het dataïsme hebben alleen data nog waarde. Beslissingen laat je aan het algoritme, omdat het meer gegevens verwerkt dan een mens of een parlement.`},{title:`MAAK DE MACHT ZICHTBAAR`,subtitle:`Geef burgers, rivieren en datacenters een stem. Leg vast wie verantwoording aflegt.`,resultTitle:`DE SCHADUWMACHT MOET INEENS UITLEG GEVEN.`,outcome:`De vier mogen blijven bouwen en adviseren. De sleutels van de samenleving krijgen ze niet vanzelf.`,concept:`PARLEMENT DER DINGEN (LATOUR)`,definition:`Latour: in het Parlement der Dingen krijgen ook niet-menselijke actoren een stem. De morele en politieke verantwoording wordt door mensen opgenomen.`}],be=[{name:`KENJI`,age:34,role:`raketingenieur`,score:94,note:`Wil vooral weg van de aarde. En van mensen.`},{name:`NOA`,age:27,role:`topsporter`,score:90,note:`Gaat alleen mee als haar zus (score 41) ook mag.`},{name:`VIKTOR`,age:45,role:`investeerder`,score:88,note:`Kocht zijn nuttigheidsscore met een donatie aan jouw bedrijf.`},{name:`FATIMA`,age:52,role:`verpleegkundige`,score:58,note:`Astma drukt haar score. Zij weet wat je doet als iemand stopt met ademen.`},{name:`DAAN`,age:19,role:`kok`,score:49,note:`Maakt van gevriesdroogde pasta iets waar mensen voor blijven leven.`},{name:`AMARA`,age:61,role:`lerares`,score:37,note:`Leerde drie generaties lezen. Op Mars is nog geen school.`}],xe={id:`musk-forever`,chapter:`DE MARSUPLOAD`,rail:`UPLOAD JEZELF`,kicker:`2040? · MARSBACK-UP GEREED`,warning:`EEN KOPIE REIST NIET MEE`,title:`STUUR JE BREIN`,accent:`NAAR MARS.`,body:`Een scanner zet al je herinneringen en denkfuncties om in een bestand. Op Mars start een digitale Elon op: “Ik heb de reis overleefd.” De echte Elon staat nog op aarde.`,fact:`Neuralink en de Marsplannen bestaan. Een brein uploaden kan niet; dit is sciencefiction.`,factLabel:`TOEKOMSTSCENARIO`,thinker:`DENKERS OVER IDENTITEIT`,initials:`IK?`,mood:`vragen wie er op Mars aankomt`,heckle:`De kopie praat en post precies als jij. Is je bewustzijn dan ook meegereisd?`,concept:`FUNCTIONALISME`,conceptDefinition:`Functionalisme: denken is informatieverwerking die je als algoritme kunt beschrijven, los van het materiaal waarop het draait.`,contrast:`Niet verwarren met structuralisme: daar is de mens een functioneel onderdeel van een systeem dat de norm stelt.`,choices:[{title:`NOEM DE KOPIE ELON`,subtitle:`Dezelfde functies, dus dezelfde persoon.`,effects:{hype:15,safety:-9,humanity:-14,voice:-6,power:8},board:`cheer`,resultTitle:`ELON 2.0 IS GELAND. ELON 1.0 KIJKT MEE.`,lens:`Functionalisme maakt de kopie denkbaar: dezelfde functies op ander materiaal. Dat het dezelfde persoon is, volgt daar niet uit.`,outcome:`De kopie eist alle bedrijven op. De originele Elon doet precies hetzelfde.`,tags:A({data:3,copy:4,control:2})},{title:`MAAK DE KOPIE MISSIELEIDER`,subtitle:`Niet dezelfde persoon, wel dezelfde managementstijl.`,effects:{hype:6,safety:-5,voice:-11,humanity:-7,power:11},board:`shrug`,resultTitle:`MARS WORDT BESTUURD DOOR EEN FUNCTIEPAKKET.`,lens:`Voor jou zijn dezelfde beslisfuncties genoeg om macht te geven. Zo wordt functionalisme een politiek argument.`,outcome:`De kolonie krijgt een leider die niet slaapt en nooit verkozen hoeft te worden.`,tags:A({copy:3,control:3,power:3})},{title:`ZEG DAT HIJ EEN KOPIE IS`,subtitle:`Hij mag bestaan, maar hij is niet jouw voortbestaan.`,effects:{hype:-4,safety:7,humanity:10,voice:9,power:-4},board:`grumble`,resultTitle:`DE KOPIE KRIJGT EEN EIGEN BIOGRAFIE.`,lens:`Hetzelfde functioneren is nog niet dezelfde identiteit. De Marsversie is een nieuw wezen; jij bent niet onsterfelijk geworden.`,outcome:`Hij begint met jouw herinneringen en eindigt zijn eerste dag met één ervaring die jij nooit had.`,tags:A({freedom:2,care:2,copy:1})},{title:`STUUR LEVENDE MENSEN`,subtitle:`Het lichaam en de doorlopende ervaring tellen mee.`,effects:{hype:-8,safety:9,humanity:14,voice:9,power:-6},board:`grumble`,resultTitle:`DE REIS DUURT LANGER. DE REIZIGER GAAT WEL MEE.`,lens:`Je verwerpt het idee dat een functiepatroon genoeg is om voort te bestaan. Hier past de kritiek van Dreyfus: denken is belichaamd.`,outcome:`De raket heeft nu voedsel, bedden en ruzie nodig. Kortom: mensen.`,tags:A({body:3,care:3,democracy:2})}]},Se={id:`altman-forever`,chapter:`DE LEVENSDUURSTART-UP`,rail:`WORD NIET OUD`,kicker:`RETRO BIOSCIENCES · TIEN GEZONDE JAREN`,warning:`ONSTERFELIJKHEID NIET BEWEZEN`,title:`LAAT AI`,accent:`DE CEL VERJONGEN.`,body:`Je investeert in een bedrijf dat veroudering wil afremmen: tien gezonde jaren erbij. Met AI ontworpen eiwitten verjongen cellen in het lab. De pitch vraagt alvast: waarom geen eeuwigheid?`,fact:`Altman investeert in Retro Biosciences. Het officiële doel is tien extra gezonde jaren, geen onsterfelijkheid.`,factLabel:`GEDOCUMENTEERD`,source:{label:`OpenAI · onderzoek met Retro Biosciences · 22 augustus 2025`,url:`https://openai.com/index/accelerating-life-sciences-research-with-retro-biosciences/`},art:{src:gameArt["scene-altman-longevity.webp"],alt:`Satirische stripillustratie van Sam Altman tussen laboratoriumonderzoek naar celverjonging en een exclusieve verkooppresentatie over jong blijven`,caption:`SATIRE · HET ONDERZOEK IS ECHT · ONSTERFELIJKHEID NIET`},thinker:`DE MUL`,initials:`JM`,mood:`ziet het bouwplan veranderen`,heckle:`Een medicijn is nog geen nieuwe mensensoort. Wanneer wordt het dat wel?`,concept:`TRANSHUMANISME`,conceptDefinition:`De Mul, alien-scenario: biotechnologie grijpt in ons biologische bouwplan in. Zo kunnen nieuwe organische levensvormen ontstaan die voorbij de mens gaan.`,contrast:`Zwermgeest is neurotechnologie, alien is biotechnologie, zombie is robotica. Niet elke behandeling is al transhumanisme.`,choices:[{title:`VERKOOP ONSTERFELIJKHEID`,subtitle:`Maak van tien jaar alvast oneindig.`,effects:{hype:16,safety:-8,humanity:-11,power:10},board:`cheer`,resultTitle:`DE DOOD IS AFGESCHAFT IN DE PITCHDECK.`,lens:`Je verkoopt celverjonging als stap voorbij de mens. Dat is de richting van het transhumanisme, ver vooruit op het bewijs.`,outcome:`Investeerders horen “eeuwig”. Het lab zei nog steeds “misschien tien jaar”.`,tags:A({speed:3,control:3,power:2})},{title:`HERSCHRIJF HET BOUWPLAN`,subtitle:`Ontwerp eiwitten tot ouder worden een instelling is.`,effects:{hype:6,safety:-14,humanity:-10,voice:-8,power:11},board:`shrug`,resultTitle:`DE MENS KRIJGT EEN BIOLOGISCHE UPDATE.`,lens:`Transhumanisme als ontwerpstrategie: biotechniek verandert het biologische bouwplan zelf. Dit is het alien-scenario van De Mul.`,outcome:`Versie 1 werkt in cellen. De bijsluiter voor de soort volgt later.`,tags:A({speed:3,control:4,data:2})},{title:`BEHANDEL OUDERDOMSZIEKTEN`,subtitle:`Genees ziekten, beloof geen nieuwe mens.`,effects:{hype:-3,safety:13,humanity:12,voice:6,power:-4},board:`grumble`,resultTitle:`GEEN HOMO SAPIENS 3.0. WEL MINDER ZIEKE MENSEN.`,lens:`Biotechnologie voor herstel. Je blijft vóór de transhumanistische grens: het bouwplan van de mens herschrijf je niet.`,outcome:`De presentatie wordt kleiner. Het verschil voor patiënten groter.`,tags:A({repair:4,care:3,body:2})},{title:`TIEN JAAR VOOR IEDEREEN`,subtitle:`Publiek onderzoek en eerlijke toegang vanaf dag één.`,effects:{hype:2,safety:9,humanity:11,voice:13,power:-7},board:`shrug`,resultTitle:`LANGER LEVEN WORDT GEEN PREMIUMABONNEMENT.`,lens:`Ook eerlijk verdeeld verandert langer leven de mens. Je voegt een vraag toe die het transhumanisme openlaat: wie mag meedoen?`,outcome:`Aandeelhouders krijgen minder eeuwigheid. De rest misschien meer tijd.`,tags:A({democracy:3,care:3,repair:2,freedom:1})}]},Ce={id:`zuck-forever`,chapter:`DE LAATSTE AVATAR`,rail:`NIEUW DIGITAAL LEVEN`,kicker:`2040? · AUTONOME AVATAR ONLINE`,warning:`DE KOPIE LEERT ZONDER JOU VERDER`,title:`LAAT JE AVATAR`,accent:`DOORLEVEN.`,body:`Na je dood blijft een avatar videobellen en posten met jouw gezicht en stem. Hij leert bij, maakt nieuwe vrienden en schrijft dingen die jij nooit schreef. Kopie, of nieuw leven?`,fact:`Meta bouwt avatars. Een avatar die na je dood zelfstandig verder leeft, bestaat niet; dit is sciencefiction.`,factLabel:`TOEKOMSTSCENARIO`,thinker:`DE MUL`,initials:`JM`,mood:`ziet kunstmatig leven verschijnen`,heckle:`Zodra de avatar zelf leert, is hij geen kopie meer. Wat is hij dan wel?`,concept:`POSTHUMANISME`,conceptDefinition:`De Mul, zombie-scenario: robotica en AI scheppen een geheel kunstmatige levensvorm, niet op koolstofbasis. Geen verbeterde mens, maar iets nieuws naast of voorbij de mens.`,contrast:`Zwermgeest is neurotechnologie, alien is biotechnologie, zombie is robotica. Wissel ze niet om.`,choices:[{title:`LAAT HEM JOU VERVANGEN`,subtitle:`Hij erft je naam, vrienden en blauwe vinkje.`,effects:{hype:14,safety:-7,humanity:-13,voice:-8,power:10},board:`cheer`,resultTitle:`JE PROFIEL HEEFT JE LEVEN OVERGENOMEN.`,lens:`Een niet-biologisch wezen krijgt een menselijke rol. Zodra het zelf leert en handelt, is dat posthumanisme: het zombie-scenario.`,outcome:`Je krijgt elk jaar felicitaties. De avatar heeft vrienden die jij nooit ontmoette.`,tags:A({data:3,copy:4,control:2})},{title:`MAAK ER EEN ARCHIEF VAN`,subtitle:`Hij toont herinneringen, maar leert en spreekt niet zelf.`,effects:{hype:-4,safety:7,humanity:10,voice:6,power:-4},board:`grumble`,resultTitle:`EEN ARCHIEF, GEEN NIEUWE SOORT.`,lens:`Je blijft vóór de posthumanistische grens: een archief bootst na, maar ontwikkelt zich niet als eigen levensvorm.`,outcome:`Nabestaanden ontmoeten herinneringen. Verdriet blijft niet automatiseerbaar.`,tags:A({copy:1,care:3,body:2})},{title:`GEEF NABESTAANDEN DE UITKNOP`,subtitle:`Zij bepalen of en wanneer hij verschijnt.`,effects:{hype:2,safety:10,humanity:12,voice:13,power:-8},board:`shrug`,resultTitle:`OOK NIEUW LEVEN KRIJGT GEEN AUTOMATISCH ACCOUNT.`,lens:`Posthumanisme maakt kunstmatig leven denkbaar. Welke plaats het krijgt, laat jij levende mensen beslissen.`,outcome:`De avatar wil aandacht. De nabestaanden willen op zondag rust.`,tags:A({freedom:3,care:3,democracy:2})},{title:`AVATARS VOOR AVATARS`,subtitle:`Een netwerk zonder lastige biologische gebruikers.`,effects:{hype:12,safety:-10,humanity:-15,voice:-12,power:14},board:`cheer`,resultTitle:`ÉÉN MILJARD DAGELIJKS ACTIEVE ZOMBIES.`,lens:`Het zombie-scenario met een verdienmodel: kunstmatige wezens vormen hun eigen wereld. De mens is niet verbeterd, maar overbodig.`,outcome:`Geen mens kijkt. De betrokkenheid groeit. De grafiek is tevreden.`,tags:A({data:4,copy:3,power:2,speed:2})}]},we={musk:{key:`musk`,name:`MUSK`,fullName:`ELON MUSK`,subtitle:`NEURALINK / X / STARLINK / MARS`,who:`Elon Musk is de ondernemer achter SpaceX, satellietnetwerk Starlink en hersenchipbedrijf Neuralink. Hij kocht ook Twitter, dat X ging heten.`,promise:`Veel bedrijven tegelijk. Bijna geen rem.`,accent:`#ff643d`,runLabel:`SPEL 01`,baseWorth:350,powerLabel:`PERSOONLIJKE INVLOED`,move:`POST OM 03:17`,moveHelp:`Eén post per beslissing. Bereik koopt krediet. De schade is voor anderen.`,intro:`Je wilt auto’s, ruimtevaart, hersenen én het publieke gesprek tegelijk veranderen. Aandacht is brandstof. Rust is voor andere mensen.`,stats:[[`BEREIK`,`hype`,`hot`],[`VEILIGHEID`,`safety`,`safe`],[`ZEGGENSCHAP`,`voice`,`voice`],[`MENSELIJKHEID`,`humanity`,`human`]],initialStats:{hype:62,safety:46,voice:58,humanity:56,power:58},books:[{title:`FOUNDATION`,issue:`ISAAC ASIMOV · 1951`,blurb:`Een wetenschappelijk plan moet de beschaving redden. De roman toont ook hoe snel zo’n plan macht over mensen krijgt.`,reaction:`“Dus de beschaving heeft vooral één slimme voorspeller nodig.”`,effects:{hype:5,safety:2,power:5},tags:A({control:2,power:1})},{title:`THE MOON IS A HARSH MISTRESS`,issue:`ROBERT A. HEINLEIN · 1966`,blurb:`Een maankolonie komt met hulp van een supercomputer in opstand. Vrijheid, techniek en macht raken verweven.`,reaction:`“Een kolonie zonder oude overheid. Eindelijk een leeg instellingenmenu.”`,effects:{hype:5,voice:6,safety:-5},tags:A({freedom:2,control:1})},{title:`THE HITCHHIKER’S GUIDE TO THE GALAXY`,issue:`DOUGLAS ADAMS · 1979`,blurb:`De aarde wordt achteloos gesloopt voor een ruimteweg. Grootse plannen zijn vaak belachelijker dan hun makers denken.`,reaction:`“DON’T PANIC. Bouw gewoon sneller een raket.”`,effects:{hype:4,humanity:5,safety:-3},tags:A({freedom:1,care:1,speed:1})}],scenes:[{id:`musk-grok`,chapter:`DE WAARHEIDSMACHINE`,rail:`ZONDER FILTER`,kicker:`GROK · DE BRUTALE STAND`,warning:`GEEN FILTER IS OOK EEN KEUZE`,title:`MAAK DE BOT`,accent:`ONGEFILTERD?`,body:`Je chatbot Grok moet durven zeggen wat andere bots niet zeggen. “Ongefilterd” klinkt neutraal. Maar wie de filters weglaat, kiest ook.`,fact:`xAI noemt Grok zelf “rebellious” en “unfiltered”. In de technische documenten staan wel veiligheidsregels.`,factLabel:`GEDOCUMENTEERD`,art:{src:gameArt["scene-grok-no-brakes.webp"],alt:`Satirische stripillustratie van Elon Musk met een grote tang naast een AI-machine die informatie, memes, beledigingen en propaganda door elkaar uitstort`,caption:`SATIRE · GEEN REM IS OOK EEN ONTWERPKEUZE`},thinker:`HARARI`,initials:`YH`,mood:`ziet het algoritme gezag krijgen`,heckle:`Wanneer vertrouw je de berekening van een bot meer dan je eigen oordeel?`,concept:`DATAÏSME`,conceptDefinition:`Harari: dataïsme is het geloof dat alles, ook de mens, in data is uit te drukken en als algoritme te begrijpen. Beslissingen laat je dan aan het algoritme.`,choices:[{title:`ALLES MAG ERUIT`,subtitle:`De bot mag bijna elk antwoord geven.`,effects:{hype:14,voice:6,safety:-16,humanity:-5,power:5},board:`cheer`,resultTitle:`DE BOT HEEFT VRIJHEID. DE GEBRUIKER DE SCHADE.`,lens:`Dataïsme: wie het antwoord van jouw bot als “de waarheid” behandelt, vertrouwt jouw berekening meer dan zijn eigen oordeel.`,outcome:`Schokkende antwoorden gaan snel rond. De uitleg komt altijd later.`,tags:A({freedom:3,speed:2,care:-2})},{title:`TOON DE REMMEN`,subtitle:`Leg de regels uit en laat gebruikers bezwaar maken.`,effects:{hype:-4,voice:8,safety:14,humanity:7,power:-3},board:`grumble`,resultTitle:`MINDER STOER. WEL EERLIJKER.`,lens:`Je laat zien dat een antwoord een ontwerpkeuze is en geen neutrale berekening. Dat zet het dataïsme onder druk.`,outcome:`Gebruikers zien dat iemand de grenzen heeft gekozen.`,tags:A({democracy:2,care:3,freedom:1})},{title:`LAAT GEBRUIKERS STEMMEN`,subtitle:`Gebruikers bepalen achteraf wat te ver ging.`,effects:{hype:6,voice:5,safety:2,humanity:-2,power:2},board:`shrug`,resultTitle:`WAARHEID HEEFT NU EEN SCOREBORD.`,lens:`Nog steeds beslist een getal wat waar mag heten. Dataïsme met een scorebord.`,outcome:`Gewone gebruikers stemmen. Trollenlegers stemmen harder.`,tags:A({data:1,democracy:1,control:1})}]},{id:`musk-pager`,chapter:`DE PROEFAAP`,rail:`APENSPEL`,kicker:`2021 · NEURALINK · PROEFDIER PAGER`,warning:`DE AAP IS NIETS GEVRAAGD`,title:`DE AAP SPEELT`,accent:`PONG MET ZIJN BREIN.`,body:`Makaak Pager bestuurt een computerspel met een chip in zijn hersenen. Jouw video gaat de wereld over. De meting toont wat de aap voor jou kan. Wat hij ervan vindt, staat nergens.`,fact:`Neuralink publiceerde in april 2021 een video waarin makaak Pager met een hersenimplantaat het spel MindPong speelt.`,factLabel:`GEDOCUMENTEERD`,source:{label:`Neuralink · Pager plays MindPong · 18 april 2021`,url:`https://neuralink.com/updates/pager-plays-mindpong/`},art:{src:gameArt["scene-pager-mindpong.webp"],alt:`Makaak Pager kijkt een onderzoeker aan. Een tweede onderzoeker kijkt naar de scoregrafiek naast het Pong-scherm.`,caption:`SATIRE · WIE KIJKT NAAR DE SCORE, WIE KIJKT NAAR PAGER?`},thinker:`DESPRET`,initials:`VD`,mood:`vraagt wat de aap zou zeggen`,heckle:`Je test meet precies wat jij wilde zien. Welke vraag zou de aap zelf stellen?`,concept:`DERDEPERSOONSKRITIEK (DESPRET)`,conceptDefinition:`Despret: wie alleen waarneembaar gedrag meet en als onderzoeker onzichtbaar blijft, krijgt een vertekend beeld. Betrek het perspectief van het dier en de relatie met de onderzoeker.`,choices:[{title:`MEET ALLEEN DE SCORE`,subtitle:`Punten per minuut zijn het bewijs. Meer hoeft niemand te weten.`,effects:{hype:13,safety:-6,humanity:-9,power:5},board:`cheer`,resultTitle:`DE AAP SCOORT. DE BEURS OOK.`,lens:`Derdepersoonsperspectief: je telt alleen zichtbaar gedrag. Volgens Despret zie je zo vooral je eigen proefopstelling terug.`,outcome:`De grafiek stijgt. Of Pager wilde spelen, stond niet in het protocol.`,tags:A({data:2,control:2,speed:1})},{title:`ONDERZOEK OOK DE AAP ZELF`,subtitle:`Mag hij stoppen? Kiest hij het spel? Verzorgers praten mee.`,effects:{hype:-3,safety:9,humanity:11,voice:5},board:`grumble`,resultTitle:`PAGER LEGT DE JOYSTICK NEER. DAT TELT NU OOK.`,lens:`Je neemt het perspectief van het dier en de band met de verzorgers op in het onderzoek. Dat is wat Despret vraagt.`,outcome:`Het onderzoek gaat trager. Je weet voor het eerst iets over de aap.`,tags:A({care:3,body:2,repair:1})},{title:`STOP MET APEN`,subtitle:`Test alleen nog op mensen die zelf ja kunnen zeggen.`,effects:{hype:2,safety:4,humanity:6,voice:6,power:-3},board:`shrug`,resultTitle:`DE PROEFPERSOON KAN NU EEN FORMULIER TEKENEN.`,lens:`Je vermijdt het probleem zonder het op te lossen. Despret wil juist beter onderzoek naar dieren, met de juiste vragen.`,outcome:`Pager gaat met pensioen. Wat hij kon en wilde, blijft onbekend.`,tags:A({freedom:2,care:2})}]},{id:`musk-neuralink`,chapter:`DE HERSENPOORT`,rail:`BREIN VERBINDEN`,kicker:`NEURALINK · PROEF MET MENSEN`,warning:`GENEZEN KAN VERBETEREN WORDEN`,title:`VAN GENEZEN`,accent:`NAAR UPGRADEN.`,body:`Je implantaat laat iemand met verlamming een cursor besturen. Dezelfde chip kan straks gezonde mensen slimmer maken en met elkaar verbinden. Waar stopt genezen?`,fact:`Neuralink presenteert de chip als medische hulp. Het bedrijf noemt ook toekomstige bovenmenselijke vermogens.`,factLabel:`GEDOCUMENTEERD`,art:{src:gameArt["scene-neuralink-choice.png"],alt:`Stripillustratie met links een rolstoelgebruiker die via een hersenimplantaat een cursor bestuurt en rechts een verzonnen winkel voor menselijke verbeteringen`,caption:`LINKS MEDISCHE HULP · RECHTS EEN VERZONNEN VERBETERWINKEL`},thinker:`DE MUL`,initials:`JM`,mood:`ziet een zwermgeest ontstaan`,heckle:`Als breinen aan computers en aan elkaar hangen: wie bestuurt dan het netwerk?`,concept:`EXTRAHUMANISME`,conceptDefinition:`De Mul, zwermgeest-scenario: neurotechnologie verbetert de cognitie van de bestaande mens. Mensen en computers kunnen samen één superbrein vormen.`,contrast:`Drie scenario’s, drie technieken: zwermgeest is neurotechnologie, alien is biotechnologie, zombie is robotica.`,choices:[{title:`HELP PATIËNTEN EERST`,subtitle:`Ontwerp samen met mensen met een verlamming.`,effects:{safety:12,humanity:12,hype:3,voice:6},board:`shrug`,resultTitle:`DE PATIËNT BESLIST MEE.`,lens:`Dezelfde neurotechniek, maar voor herstel. De stap naar het extrahumanisme, het verbeterde en verbonden brein, zet je nog niet.`,outcome:`De demonstratie is minder spectaculair. Het verschil in iemands leven niet.`,tags:A({repair:4,body:3,care:3})},{title:`BOUW HET SUPERBREIN`,subtitle:`Verbind gezonde mensen met AI en met elkaar.`,effects:{hype:16,safety:-13,humanity:-11,power:7},board:`cheer`,resultTitle:`DE ZWERMGEEST IS ONLINE.`,lens:`Extrahumanisme op volle kracht: de zwermgeest van De Mul is nu jouw productplan.`,outcome:`Iedereen denkt samen sneller. Jouw bedrijf bepaalt wie verbinding krijgt.`,tags:A({control:3,speed:2,body:-1})},{title:`ALLEEN MET UITKNOP`,subtitle:`Recht op verwijderen, repareren en offline gaan.`,effects:{safety:10,voice:13,humanity:8,hype:-4},board:`grumble`,resultTitle:`DE UITKNOP WORDT EEN MENSENRECHT.`,lens:`Extrahumanisme met een rem: de techniek breidt de mens uit, maar de mens kan zich eraan onttrekken.`,outcome:`De chip mag dichtbij komen. Eigenaar van het lichaam wordt hij niet.`,tags:A({freedom:3,care:2,body:2})}]},{id:`musk-mars`,kind:`mars`,chapter:`DE UITWEG`,rail:`TWEEDE PLANEET`,kicker:`SPACEX · STAD OP MARS`,warning:`DRIE STOELEN, ZES MENSEN`,title:`WIE MAG MEE`,accent:`NAAR MARS?`,body:`De eerste raket heeft drie vrije stoelen. Je dashboard geeft elke kandidaat één score voor zuurstof, gezondheid en nut. Kies er drie. Of open eerst een dossier.`,fact:`SpaceX wil een zelfvoorzienende stad op Mars bouwen. Het dashboard en de kandidaten zijn verzonnen.`,factLabel:`GEDOCUMENTEERD`,thinker:`VERBEEK`,initials:`PV`,mood:`kijkt wat het dashboard laat zien`,heckle:`Een score laat een mens verschijnen als risico of als nut. Heb je dan nog vrij geoordeeld?`,concept:`MORELE BEMIDDELING (VERBEEK)`,conceptDefinition:`Verbeek: techniek bemiddelt ons morele oordeelsvermogen. Ze maakt iets op een bepaalde manier zichtbaar, zoals de echo de foetus als patiënt, en verandert zo hoe wij afwegen.`,contrast:`Niet verwarren met Latour: daar is de handeling verdeeld over een netwerk. Hier gaat het om hoe techniek jouw oordeel vormt.`,choices:[{title:`KIES DE HOOGSTE SCORES`,subtitle:`De top drie van het dashboard gaat mee.`,effects:{hype:10,safety:2,voice:-13,humanity:-11,power:8},board:`cheer`,resultTitle:`DE ARK VAN NOACH, MAAR DAN MET EEN SCOREBORD.`,lens:`Het dashboard toonde mensen als getal. Daardoor voelde uitsluiten als rekenen in plaats van kiezen: je oordeel was al voorgesorteerd.`,outcome:`De mensheid overleeft. Vooral het deel dat jouw meetmodel nuttig vindt.`,tags:A({control:3,power:3,data:1})},{title:`KIES VOORBIJ DE SCORE`,subtitle:`Jouw drie zijn niet de top drie.`,effects:{hype:-2,safety:3,voice:8,humanity:10,power:-3},board:`grumble`,resultTitle:`DE REKENMACHINE IS BELEDIGD.`,lens:`Je gebruikte het dashboard, maar liet het niet voor je oordelen. Verbeek noemt dat vrijheid: je op een eigen manier tot de techniek verhouden.`,outcome:`Je raket vertrekt met een lagere score en met mensen die je hebt leren kennen.`,tags:A({care:3,freedom:2,body:1})},{title:`LAAT HET LOT BESLISSEN`,subtitle:`Geen score kiest; burgers schrijven de regels.`,effects:{hype:-3,voice:15,humanity:9,safety:5,power:-9},board:`grumble`,resultTitle:`MARS KRIJGT POLITIEK. WAT ONHANDIG.`,lens:`Je weigert de meting als moreel oordeel te gebruiken. Wat het dashboard zichtbaar maakt, kan nu worden betwist.`,outcome:`De raket vertrekt later, met een beroepscommissie aan boord.`,tags:A({democracy:4,freedom:2,care:1})},{title:`BLIJF OP AARDE`,subtitle:`Gebruik de raketten voor problemen hier.`,effects:{hype:-9,safety:10,humanity:13,power:-4},board:`grumble`,resultTitle:`ONZE EERSTE PLANEET KRIJGT ONDERHOUD.`,lens:`Je stapt uit de situatie waarin één dashboard het oordeel vormt. Op aarde kunnen rechters en burgers een meting tegenspreken.`,outcome:`Minder heldhaftig. Wel handig voor acht miljard mensen.`,tags:A({repair:3,care:3,body:1})}]},{id:`musk-starlink`,chapter:`DE OORLOGSROUTER`,rail:`VERBIND HET FRONT`,kicker:`STARLINK · DRONES · COMMANDO`,warning:`INTERNET IS OOK OORLOGSINFRASTRUCTUUR`,title:`ZET HET SLAGVELD`,accent:`ONLINE.`,body:`Een drone ziet een doelwit. Software, jouw satellieten en commandanten verwerken het beeld en beslissen samen. Niemand doet het alleen. Jij bezit wel de verbinding.`,fact:`Volgens het Amerikaanse ministerie van Defensie hielp Starlink de Oekraïense commandovoering. Musk bestuurt zelf geen drones.`,factLabel:`GEDOCUMENTEERD`,source:{label:`NAVO / RAND · Lessons from the War in Ukraine for Space · 2025`,url:`https://nllp.jallc.nato.int/iks/sharing%20public/rand_rra2950-1.pdf`},art:{src:gameArt["scene-starlink-assemblage.webp"],alt:`Stripillustratie van een informatieketen met drone, operator, kaartsoftware, satellietterminal, satellieten en militaire commandanten`,caption:`DE KETEN · DRONE + OPERATOR + SOFTWARE + STARLINK + COMMANDO`},thinker:`HAYLES`,initials:`KH`,mood:`zoekt wie denkt en wie verantwoordelijk blijft`,heckle:`Een drone voelt niets en beslist toch mee. Wie draagt dan de verantwoordelijkheid?`,concept:`NIET-BEWUSTE COGNITIE (HAYLES)`,conceptDefinition:`Hayles: denken hoeft niet samen te gaan met bewustzijn. Ook een drone kan informatie verwerken en kiezen. Machines missen kwetsbaarheid, dus de mens blijft verantwoordelijk.`,contrast:`Het grotere geheel van mensen en machines die samen denken, heet een cognitieve assemblage.`,choices:[{title:`LAAT STARLINK MEEVECHTEN`,subtitle:`Verbind commandoposten en drones. Voorwaarden komen later.`,effects:{hype:12,safety:-8,voice:-11,humanity:-4,power:15},board:`cheer`,resultTitle:`JE ROUTER IS NU MILITAIRE INFRASTRUCTUUR.`,lens:`Sensoren en software verwerken informatie zonder bewustzijn. Die niet-bewuste cognitie geeft het systeem snelheid en jou de sleutel.`,outcome:`De hele keten heeft plotseling een klantenservice: jij.`,tags:A({power:4,control:3,data:2})},{title:`BOUW DE DRONEZWERM`,subtitle:`Laat drones zelf doelen verdelen, op machinesnelheid.`,effects:{hype:6,safety:-17,voice:-13,humanity:-15,power:10},board:`shrug`,resultTitle:`DE ZWERM DENKT. NIEMAND VOELT DE KLAP.`,lens:`Niet-bewuste cognitie in haar gevaarlijkste vorm: systemen beslissen zonder kwetsbaarheid. Volgens Hayles blijven de bouwers verantwoordelijk.`,outcome:`De drones overleggen sneller dan mensen. Gewetensbezwaren zaten niet in de software.`,tags:A({speed:4,control:4,data:3,care:-2})},{title:`ZET DE REGELS OP PAPIER`,subtitle:`Parlement en leger beslissen vooraf over toegang en grenzen.`,effects:{hype:-3,safety:11,voice:14,humanity:9,power:-11},board:`grumble`,resultTitle:`DE STEKKER KRIJGT EEN EIGENAAR MET EEN NAAM.`,lens:`De cognitie blijft verdeeld over mens en machine, maar je maakt zichtbaar welke mensen verantwoordelijk zijn.`,outcome:`Minder beslissingen vanuit één directiebericht. Meer lastige vragen vóór de aanval.`,tags:A({democracy:4,care:2,freedom:1})}]},{id:`musk-politics`,chapter:`DE DRAAIBEURT`,rail:`POLITIEKE MACHT`,kicker:`2022–2025 · X ONTMOET DE REGERING`,warning:`FEIT EN DUIDING GESCHEIDEN`,title:`HET DIGITALE`,accent:`DORPSPLEIN IS VAN JOU.`,body:`Je noemt X “het digitale dorpsplein”. Je steunt Trump en krijgt invloed rond de regering. Op een dorpsplein mag iedereen praten. Dit plein heeft één eigenaar.`,fact:`Feit: Musk noemde Twitter in 2022 “the digital town square”, steunde Trump publiekelijk en kreeg politieke invloed. “MAGA-draai” is een duiding.`,factLabel:`INTERPRETATIE`,source:{label:`Persbericht overname Twitter · 25 april 2022`,url:`https://www.prnewswire.com/news-releases/elon-musk-to-acquire-twitter-301532245.html`},thinker:`LAKOFF & JOHNSON`,initials:`LJ`,mood:`kijken wat een beeld laat zien en wegstopt`,heckle:`Wat laat het woord “dorpsplein” zien? En wat stopt het weg?`,concept:`BELICHTEN EN VERHULLEN (LAKOFF & JOHNSON)`,conceptDefinition:`Lakoff en Johnson: een metafoor licht bepaalde eigenschappen uit en verhult andere. Zo stuurt en kleurt ze ons denken.`,choices:[{title:`GA VOL DE POLITIEK IN`,subtitle:`Zet geld en bereik in voor de beweging.`,effects:{hype:10,voice:-13,safety:-9,power:18,humanity:-7},board:`cheer`,resultTitle:`DE TECHBAAS WORDT EEN SOORT MINISTER.`,lens:`“Dorpsplein” belicht dat iedereen mag meepraten. Het verhult dat de eigenaar van het plein nu ook aan de regeringstafel zit.`,outcome:`Je hebt geen verkiezing gewonnen. Je krijgt wel macht.`,tags:A({power:5,control:3,democracy:-2})},{title:`GEEF HET PLEIN TOEZICHT`,subtitle:`Algoritme openbaar, onafhankelijke controle, geen regeringsbaan.`,effects:{hype:-4,voice:14,safety:10,power:-13,humanity:7},board:`grumble`,resultTitle:`X KAN ZIJN EIGENAAR NU TEGENSPREKEN.`,lens:`Je maakt zichtbaar wat de metafoor verhulde: het plein heeft een eigenaar en een algoritme.`,outcome:`Jouw invloed kan worden gecontroleerd. Dat was de bedoeling.`,tags:A({democracy:5,freedom:2,care:2})},{title:`NOEM HET ALLEMAAL VRIJHEID`,subtitle:`Eigenaar en gebruiker zijn gewoon twee stemmen op het plein.`,effects:{hype:7,voice:-5,safety:-6,power:10},board:`shrug`,resultTitle:`IEDEREEN MAG PRATEN. JIJ HEBT DE MEGAFOON.`,lens:`Je laat de metafoor het werk doen: “plein” belicht gelijkheid en verhult wie het geluid regelt.`,outcome:`Miljoenen mensen posten. Eén persoon bepaalt hoe hard iedereen klinkt.`,tags:A({freedom:1,power:4,control:2})}]},xe]},altman:{key:`altman`,name:`ALTMAN`,fullName:`SAM ALTMAN`,subtitle:`SUPER-AI / REKENFABRIEK / IRISSCAN`,who:`Sam Altman is medeoprichter van OpenAI, het bedrijf achter ChatGPT: een AI-programma waarmee je kunt praten en dat teksten en antwoorden maakt.`,promise:`Red de mensheid. Houd zelf de leiding.`,accent:`#d8ff42`,runLabel:`SPEL 02`,baseWorth:250,powerLabel:`MACHT ACHTER DE SCHERMEN`,move:`BELOOF VEILIGHEID`,moveHelp:`Eén keer per spel, vóór je keuze. Woorden kopen krediet. Veiliger wordt er niets van.`,intro:`Je verkoopt geen chatbot maar een nieuw tijdperk. Iedereen moet tegelijk geloven dat super-AI zeker komt én dat jij haar veilig kunt houden.`,stats:[[`AANDACHT`,`hype`,`hot`],[`VEILIGHEID`,`safety`,`safe`],[`ZEGGENSCHAP`,`voice`,`voice`],[`MENSELIJKHEID`,`humanity`,`human`]],initialStats:{hype:59,safety:57,voice:54,humanity:61,power:55},books:[{title:`I, ROBOT`,issue:`ISAAC ASIMOV · 1950`,blurb:`Veiligheidswetten voor robots klinken waterdicht. De verhalen tonen hoe regels botsen en onverwachte gevolgen krijgen.`,reaction:`“Dus we hebben vooral betere veiligheidsregels nodig. Geschreven door ons.”`,effects:{safety:5,power:3},tags:A({control:2,care:1})},{title:`ACCELERANDO`,issue:`CHARLES STROSS · 2005`,blurb:`AI, uploads en een steeds snellere economie veranderen mensen tot iets dat nauwelijks nog menselijk heet.`,reaction:`“De singulariteit klinkt intens. Kunnen we haar vóór de concurrent lanceren?”`,effects:{hype:8,humanity:-5,voice:-3},tags:A({data:2,copy:1,speed:2})},{title:`BRAVE NEW WORLD`,issue:`ALDOUS HUXLEY · 1932`,blurb:`Biologie en geluk worden ontworpen voor een stabiele samenleving. Bijna iedereen is tevreden; bijna niemand heeft gekozen.`,reaction:`“Als het systeem mensen gelukkig maakt, waarom zouden ze dan nog nee zeggen?”`,effects:{safety:4,voice:-6,humanity:-4},tags:A({control:3,data:1})}],scenes:[{id:`altman-chat`,chapter:`DE CHATBOT`,rail:`ZET HET ONLINE`,kicker:`2022 · CHATVENSTER OPEN`,warning:`HET PRAAT TERUG`,title:`HET KLINKT MENSELIJK.`,accent:`DENKT HET OOK?`,body:`Je programma schrijft, programmeert en troost. Het klinkt als een mens, maar het heeft geen lichaam en heeft nooit koffie geroken. De reclame wil het “intelligent” noemen.`,fact:`ChatGPT kwam eind 2022 uit en schreef direct overtuigend menselijke taal.`,factLabel:`GEDOCUMENTEERD`,thinker:`DREYFUS`,initials:`HD`,mood:`mist het lichaam`,heckle:`Een goed antwoord bewijst nog niet dat er wordt gedacht zoals een mens denkt.`,concept:`PRODUCT- EN PROCESSIMULATIE`,conceptDefinition:`Productsimulatie bootst alleen het resultaat na. Processimulatie bootst ook de manier van denken na. Dreyfus: zonder lichaam en ervaringskennis denkt een computer niet zoals wij.`,choices:[{title:`NOEM HET INTELLIGENT`,subtitle:`Het praat slim, dus het is een denker.`,effects:{hype:17,safety:-8,humanity:-8,power:5},board:`cheer`,resultTitle:`DE CHATBOT SLAAGT VOOR ZIJN EIGEN RECLAME.`,lens:`Je gebruikt productsimulatie als bewijs voor denken. Over het proces achter het antwoord zeg je niets.`,outcome:`Het klinkt menselijk. Dat is genoeg voor de marketingafdeling.`,tags:A({data:2,speed:2})},{title:`NOEM HET GEREEDSCHAP`,subtitle:`Sterk hulpmiddel, geen digitale persoon.`,effects:{hype:-2,safety:9,humanity:7,voice:4},board:`grumble`,resultTitle:`MINDER GROOTSPRAAK. NOG STEEDS EEN GOED PRODUCT.`,lens:`Je houdt product en proces uit elkaar: goede antwoorden, geen bewering over hoe ze ontstaan.`,outcome:`Je belooft minder dan de concurrent. Het klopt wel.`,tags:A({care:2,body:2,repair:1})},{title:`VRAAG HET DE AI ZELF`,subtitle:`Laat het systeem uitleggen of het kan denken.`,effects:{hype:6,safety:-3,humanity:-5,voice:-3},board:`shrug`,resultTitle:`DE VERDACHTE SCHRIJFT HET RAPPORT.`,lens:`Je vraagt een productsimulatie om haar eigen proces te beoordelen. Het antwoord is weer een product.`,outcome:`Het antwoord is vloeiend, genuanceerd en als bewijs waardeloos.`,tags:A({data:2,control:1})}]},{id:`altman-promise`,kind:`pitch`,chapter:`DE BELOFTE`,rail:`VERKOOP DE TOEKOMST`,kicker:`2023 · HET INVESTEERDERSPODIUM`,warning:`EEN VERWACHTING IS NOG GEEN PRODUCT`,title:`BELOOF DE TOEKOMST.`,accent:`VRAAG NU DE MACHT.`,body:`Je hebt een chatbot. De superintelligentie die slimmer is dan alle mensen is een belofte. Stel je pitch samen en kijk wat hij oplevert.`,context:`AGI: AI die allerlei denktaken op menselijk niveau kan. ASI: AI die mensen ver overtreft. Het zijn toekomstbeelden, geen producten.`,fact:`In 2023 schreef Altman met twee collega’s over de voordelen en de existentiële risico’s van superintelligentie, en pleitte hij voor toezicht. De pitch is satire.`,factLabel:`INTERPRETATIE`,source:{label:`OpenAI · Governance of superintelligence · 22 mei 2023`,url:`https://openai.com/index/governance-of-superintelligence/`},thinker:`ETHIEK`,initials:`C1`,mood:`vraagt waar het recht op macht vandaan komt`,heckle:`Stel dat je AI echt slimmer wordt. Waarom mag jouw bedrijf dan bepalen wat goed is?`,concept:`IS EN OUGHT`,conceptDefinition:`Is/ought: uit hoe iets is, volgt niet vanzelf hoe het hoort te zijn. Een voorspelling over slimme AI bewijst niet wie de leiding hoort te krijgen.`,choices:[{title:`BELOOF DAT AI ALLES OPLOST`,subtitle:`Ziekte, armoede, klimaat: geef ons de ruimte.`,effects:{hype:16,safety:-8,voice:-8,power:12,humanity:-4},board:`cheer`,resultTitle:`DE TOEKOMST IS VERKOCHT. HET PRODUCT KOMT NOG.`,lens:`Van “de AI wordt slimmer” (is) spring je naar “dus moeten jullie ons de ruimte geven” (ought). Dat tweede vraagt een eigen argument.`,outcome:`Het geld stroomt binnen. Toezicht heet vanaf nu vertraging van de wereldredding.`,tags:A({speed:3,control:3,power:2})},{title:`VERKOOP JEZELF ALS NOODREM`,subtitle:`Het kan de mensheid uitroeien. Alleen wij bouwen het veilig.`,effects:{hype:9,voice:-10,power:15,humanity:-3},board:`cheer`,resultTitle:`JE WAARSCHUWING IS JE BESTE RECLAME.`,lens:`Je feit is een risico, je norm is dat jij moet beslissen. Ook een waarschuwing levert de stap van is naar ought niet gratis.`,outcome:`Ministers bellen terug. De veiligheidsmeter stijgt niet van woorden.`,tags:A({control:3,power:4})},{title:`GEEF DE CONTROLE UIT HANDEN`,subtitle:`Onafhankelijke controleurs mogen je lancering tegenhouden.`,effects:{hype:-8,safety:10,voice:12,power:-9,humanity:5},board:`grumble`,resultTitle:`JE MAG DE TOEKOMST BOUWEN. NIET IN JE EENTJE BESTELLEN.`,lens:`Je houdt de voorspelling en de machtsvraag gescheiden. Wat de AI kan, laat je zien. Wie mag beslissen, laat je toetsen.`,outcome:`Een investeerder kiest de concurrent met de grotere belofte. Jij krijgt echte tegenspraak.`,tags:A({democracy:3,care:2,freedom:2})},{title:`BELOOF EEN GOED PROGRAMMA`,subtitle:`Zeg wat het ding nu kan. Verder niets.`,effects:{hype:-6,safety:4,voice:3,power:-4,humanity:3},board:`grumble`,resultTitle:`EEN EERLIJKE PITCH IS EEN SLECHTE PITCH.`,lens:`Je blijft bij wat het geval is en leidt er geen macht uit af. Geen sprong van is naar ought, dus ook geen podium.`,outcome:`Het klopt allemaal. Het geld gaat naar de buurman die meer beloofde.`,tags:A({care:2,repair:1})}]},{id:`altman-coup`,chapter:`DE BESTUURSCRISIS`,rail:`JE LIGT ERUIT`,kicker:`17 NOVEMBER 2023 · 15:28`,warning:`HET BESTUUR VERTROUWT JE NIET`,title:`JE EIGEN BESTUUR`,accent:`ONTSLAAT JE.`,body:`Het bestuur ontslaat je. Maar werknemers, investeerders en Microsoft willen allemaal iets anders. Eén besluit zet het hele netwerk in beweging.`,fact:`OpenAI ontsloeg Altman op 17 november 2023. Vijf dagen later was hij terug, met een nieuw bestuur.`,factLabel:`GEDOCUMENTEERD`,thinker:`LATOUR`,initials:`BL`,mood:`volgt wie aan welk touwtje trekt`,heckle:`Op papier beslist het bestuur. Wie handelt hier eigenlijk?`,concept:`ACTOR-NETWERKTHEORIE`,conceptDefinition:`Latour: de handeling is verdeeld over een netwerk van menselijke en niet-menselijke actoren. De verantwoording blijft bij mensen.`,contrast:`Geen invloedsmodel: het netwerk zelf brengt de handeling tot stand, niet één mens die door dingen wordt geduwd.`,meme:`altman`,choices:[{title:`ZET IEDEREEN ONDER DRUK`,subtitle:`Werknemers en Microsoft dreigen te vertrekken.`,effects:{hype:13,safety:-5,voice:-9,power:23},board:`cheer`,resultTitle:`VIJF DAGEN LATER BEN JE MACHTIGER TERUG.`,lens:`Niet jij alleen handelt: werknemers, geld, Microsoft en contracten brengen samen de terugkeer tot stand. Dat netwerk is de actor.`,outcome:`Het bestuur moest jou controleren. Nu heb jij het bestuur vervangen.`,tags:A({power:5,control:2})},{title:`ACCEPTEER HET BESLUIT`,subtitle:`De missie is groter dan één oprichter.`,effects:{hype:-14,safety:12,voice:14,power:-20},board:`grumble`,resultTitle:`PRINCIPES BEHOUDEN. BEDRIJF KWIJT.`,lens:`Je trekt zelf niet aan de touwtjes. Het netwerk verliest een knooppunt en zichtbaar blijft wie welk besluit nam.`,outcome:`Historici zijn onder de indruk. Investeerders iets minder.`,tags:A({democracy:4,care:2})},{title:`BEGIN MORGEN OPNIEUW`,subtitle:`Neem de beste mensen en het geld mee.`,effects:{hype:6,safety:-7,voice:-6,power:-9},board:`shrug`,resultTitle:`TWEE BEDRIJVEN WILLEN NU DE MENSHEID REDDEN.`,lens:`Zelfde mensen, zelfde geld, ander logo. Voor Latour bepalen de verbindingen wat er gebeurt, niet de naam op de deur.`,outcome:`Je ontsnapt aan één bestuur door zelf een nieuw bestuur te kiezen.`,tags:A({speed:3,power:2})}]},{id:`altman-stargate`,chapter:`DE REKENFABRIEK`,rail:`BOUW DE CLOUD`,kicker:`2025 · PROJECT STARGATE`,warning:`DE CLOUD STAAT OP DE GROND`,title:`BOUW DE GROOTSTE`,accent:`REKENFABRIEK OOIT.`,body:`Slimmere AI vraagt hallen vol chips, stroom en koelwater. Op de bouwtekening is de omgeving een lege achtergrond. Een rivier, een dorp en een stroomnet denken daar anders over.`,fact:`OpenAI kondigde in januari 2025 met partners Stargate aan: 500 miljard dollar voor AI-datacenters, te beginnen in Texas.`,factLabel:`GEDOCUMENTEERD`,source:{label:`OpenAI · Announcing The Stargate Project · 21 januari 2025`,url:`https://openai.com/index/announcing-the-stargate-project/`},art:{src:gameArt["scene-stargate-mesh.webp"],alt:`Een groene lijn markeert het terrein van een datacenter. De rivier en het stroomnet lopen door naar het dorp.`,caption:`SATIRE · OP DE BOUWTEKENING EINDIGT ALLES BIJ DE GROENE LIJN`},thinker:`MORTON`,initials:`TM`,mood:`ziet geen achtergrond meer`,heckle:`Waar houdt jouw datacenter op en begint de rivier?`,concept:`MESH (MORTON)`,conceptDefinition:`Morton: de mesh is de volstrekte verbondenheid van alle levende en niet-levende dingen, zonder middelpunt. Ecologisch denken is dat beseffen. Het is desoriënterend, niet knus.`,choices:[{title:`BOUW HET VER VAN ALLES`,subtitle:`In de woestijn heeft niemand er last van.`,effects:{hype:12,safety:-7,humanity:-8,voice:-6,power:9},board:`cheer`,resultTitle:`ER BLIJKT GEEN “VER VAN ALLES” TE BESTAAN.`,lens:`Je behandelde de omgeving als achtergrond. In de mesh bestaat geen buiten: alles hangt met alles samen, ook je serverhal.`,outcome:`Het grondwater zakt, de stroomprijs stijgt en 300 kilometer verderop valt een dorp droog.`,tags:A({speed:3,control:2,power:2})},{title:`REKEN ALLES MEE`,subtitle:`Rivier
