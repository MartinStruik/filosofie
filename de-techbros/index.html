, dorp en stroomnet zitten aan tafel voor je bouwt.`,effects:{hype:-6,safety:9,humanity:10,voice:11,power:-7},board:`grumble`,resultTitle:`DE RIVIER HEEFT INSPRAAK. DE PLANNING NIET MEER.`,lens:`Ecologisch denken: je plaatst jezelf niet meer buiten of boven de omgeving. Je verliest een vast middelpunt, en dus ook je strakke planning.`,outcome:`Het wordt kleiner, later en duurder. Het staat er over twintig jaar nog.`,tags:A({care:3,democracy:3,repair:2})},{title:`KOOP GROENE CERTIFICATEN`,subtitle:`Compenseer op papier en bouw door.`,effects:{hype:6,safety:-2,humanity:-3,power:4},board:`shrug`,resultTitle:`DE NATUUR STAAT NU IN DE BOEKHOUDING.`,lens:`Je maakt van de mesh een rekensom met jou in het midden. Volgens Morton heeft de mesh juist geen middelpunt.`,outcome:`Het jaarverslag is klimaatneutraal. De rivier heeft het jaarverslag niet gelezen.`,tags:A({data:2,control:2})}]},{id:`altman-orb`,chapter:`BEWIJS VAN MENS`,rail:`SCAN JE OOG`,kicker:`WORLD · DE BOL SCANT`,warning:`MENS-ZIJN WORDT EEN TOEGANGSPAS`,title:`BEWIJS DAT JE`,accent:`GEEN BOT BENT.`,body:`AI-bots lijken steeds meer op mensen. Een zilveren bol scant je oog en maakt er een code van: bewijs dat jij één echte mens bent. Wie mag zonder code naar binnen?`,fact:`World noemt dit “proof of human”. Het bedrijf zegt de oogscan zelf niet centraal te bewaren.`,factLabel:`GEDOCUMENTEERD`,art:{src:gameArt["scene-world-orb.png"],alt:`Stripillustratie van een jongere die in een zilveren bol kijkt voor een oogscan terwijl andere mensen wachten of doorlopen`,caption:`EEN ECHT SCANAPPARAAT · DE SITUATIE IS VEREENVOUDIGD`},thinker:`RASCH`,initials:`MR`,mood:`zoekt wat aan de data ontsnapt`,heckle:`De code bewijst dat je een mens bent. Wat zegt hij over wie je bent?`,concept:`HET ELSE`,conceptDefinition:`Rasch: het else is het vreemde, spontane en onverwachte in je bestaan dat principieel niet in data past. Een profiel maakt van een mens een karikatuur.`,contrast:`Het else is geen privacy. Privacy gaat over wie je gegevens ziet. Het else past in geen enkele dataset.`,choices:[{title:`SCAN VOOR TOEGANG`,subtitle:`Alleen wie een geldige code heeft, mag naar binnen.`,effects:{safety:8,hype:9,voice:-12,humanity:-8,power:10},board:`cheer`,resultTitle:`ELKE ECHTE MENS KRIJGT EEN VINKJE.`,lens:`Je maakt één meting tot de definitie van mens-zijn. Alles wat een mens meer is dan die code, het else, telt voor je systeem niet.`,outcome:`Bots blijven buiten. Mensen zonder geldige scan helaas ook.`,tags:A({data:4,control:3,power:2})},{title:`MEERDERE WEGEN`,subtitle:`Scan, pasje, bekenden die voor je instaan, of niets.`,effects:{hype:-3,safety:5,voice:13,humanity:10,power:-5},board:`grumble`,resultTitle:`IDENTITEIT KRIJGT EEN NOODUITGANG.`,lens:`Je laat ruimte voor het else: het profiel is een hulpmiddel en niet de hele mens.`,outcome:`Het systeem is rommeliger. Een mens hoeft niet in één meting te passen.`,tags:A({freedom:3,democracy:2,care:2})},{title:`SCAN NOG VEEL MEER`,subtitle:`Oog, gezicht, stem en gedrag: dan klopt het profiel wel.`,effects:{hype:6,safety:3,voice:-9,humanity:-10,power:8},board:`shrug`,resultTitle:`HET PROFIEL IS NU 99 PROCENT COMPLEET.`,lens:`Meer meten lost het niet op. Het else is geen gat in de data dat je kunt dichten: het past er principieel niet in.`,outcome:`Het systeem weet alles van je, behalve wat je morgen onverwacht doet.`,tags:A({data:4,control:3,copy:1})}]},{id:`altman-device`,chapter:`HET AI-DING`,rail:`ZONDER SCHERM`,kicker:`SAM + JONY · EERSTE TESTMODEL`,warning:`NIEMAND WEET NOG HOE HET ERUITZIET`,title:`LAAT HET APPARAAT`,accent:`JOU LEREN.`,body:`Met ontwerper Jony Ive bouw je een AI-apparaat zonder scherm. Stel dat het je stem en gewoonten leert en zich daaraan aanpast. Jij went intussen aan zijn adviezen. Wie traint wie?`,fact:`OpenAI en Jony Ive werken officieel samen. Vorm en functies zijn niet bekend; de opties zijn verzonnen.`,factLabel:`TOEKOMSTSCENARIO`,art:{src:gameArt["scene-altman-dynamic-device.webp"],alt:`Satirische stripillustratie waarin een klein schermloos AI-apparaat de stem, route en dagindeling van een gebruiker leert terwijl de gebruiker zijn gewoonten aanpast`,caption:`VERZONNEN TOEKOMST · HET ECHTE APPARAAT IS NOG NIET PUBLIEK`},thinker:`CLARK`,initials:`AC`,mood:`ziet mens en apparaat aan elkaar wennen`,heckle:`Je lijft techniek moeiteloos in. Wat als het apparaat hetzelfde met jou doet?`,concept:`DYNAMISCH APPARAAT (CLARK)`,conceptDefinition:`Clark: een dynamisch apparaat leert zich aan de gebruiker aan te passen. Brein en apparaat leren over elkaar en vormen één geheel. De mens is een natural-born cyborg.`,contrast:`Niet verwarren met extended mind: daar wordt een hulpmiddel deel van je denken. Hier leert het apparaat zelf mee.`,choices:[{title:`ALTIJD AAN, ALTIJD AANPASSEN`,subtitle:`Het voorspelt je wensen en vraagt niet steeds toestemming.`,effects:{hype:15,safety:-10,voice:-12,humanity:-7,power:9},board:`cheer`,resultTitle:`DE AI KENT JE GEWOONTEN. EN MAAKT ER NIEUWE BIJ.`,lens:`Een dynamisch apparaat op volle kracht: het leert jou en jij went aan hem. Het bedrijf bepaalt waaraan het zich aanpast.`,outcome:`Je assistent kent je volgende stap. Jij hoort hem als tweede.`,tags:A({control:4,data:3,power:2})},{title:`LAAT ONS ALLEBEI LEREN`,subtitle:`Toon elke aanpassing; de gebruiker kan weigeren.`,effects:{hype:2,safety:11,voice:13,humanity:9},board:`shrug`,resultTitle:`DE CYBORG KRIJGT EEN INSTELLINGENMENU.`,lens:`Mens en apparaat passen zich nog steeds aan elkaar aan, maar zichtbaar en omkeerbaar. De cyborg kan bijsturen.`,outcome:`Minder magisch. Veel duidelijker van jou.`,tags:A({freedom:4,care:3,body:1})},{title:`MAAK GEEN NIEUW APPARAAT`,subtitle:`Maak bestaande telefoons beter controleerbaar.`,effects:{hype:-10,safety:8,voice:8,humanity:6,power:-4},board:`grumble`,resultTitle:`DE TOEKOMST WORDT GEWOON EEN VERBETERING.`,lens:`Volgens Clark zijn we al natural-born cyborgs: ook een telefoon of notitieboek lijven we in. Daar is geen nieuw product voor nodig.`,outcome:`Jony is teleurgesteld. De la met oude apparaten opgelucht.`,tags:A({repair:3,care:2})}]},Se]},zuck:{key:`zuck`,name:`ZUCK`,fullName:`MARK ZUCKERBERG`,subtitle:`TIJDLIJN / VIRTUELE WERELD / AI-BRIL`,who:`Mark Zuckerberg richtte Facebook op. Zijn bedrijf Meta is ook bekend van Instagram en WhatsApp, en bouwt slimme brillen en virtuele werelden.`,promise:`Leer iedere gebruiker kennen. Verkoop de aandacht.`,accent:`#4b78ff`,runLabel:`SPEL 03`,baseWorth:450,powerLabel:`MACHT OVER DE APP`,move:`PRAAT HET RECHT`,moveHelp:`Eén keer per spel, na een keuze: dit was altijd al het plan. De raad gelooft het.`,intro:`Je bouwt een omgeving waar mensen hun vrienden, foto’s, woede en een kwart van hun dag naartoe brengen. Jij schrijft hun berichten niet. Jij bepaalt wat ze als eerste zien.`,originArt:{src:gameArt["scene-snow-crash-business-plan.webp"],alt:`Satirische stripillustratie van een jonge Mark Zuckerberg die een sciencefictionroman leest en ideeën voor een virtuele wereld uittekent`,caption:`SATIRE · SNOW CRASH IS EEN ECHTE ROMAN · GEEN BEWERING OVER ZUCKERBERGS JEUGD`},stats:[[`GROEI`,`hype`,`hot`],[`ZORG`,`safety`,`safe`],[`ZEGGENSCHAP`,`voice`,`voice`],[`WELZIJN`,`humanity`,`human`]],initialStats:{hype:60,safety:48,voice:52,humanity:56,power:64},books:[{title:`SNOW CRASH`,issue:`NEAL STEPHENSON · 1992`,blurb:`Een metaverse biedt ontsnapping aan een wereld van bedrijven en kapotte politiek. Het boek waarschuwt voor de macht erachter.`,reaction:`“De metaverse is al uitgeschreven. De dystopie parkeren we bij versie 2.”`,effects:{hype:6,power:5,humanity:-3},tags:A({control:2,data:1})},{title:`READY PLAYER ONE`,issue:`ERNEST CLINE · 2011`,blurb:`Miljoenen mensen vluchten een virtuele wereld in omdat de echte stukloopt. De ontsnapping is prachtig; de reden minder.`,reaction:`“Als de echte wereld tegenvalt, maken we de headset comfortabeler.”`,effects:{hype:5,humanity:-4,safety:2},tags:A({body:-1,copy:1,control:1})},{title:`THE CIRCLE`,issue:`DAVE EGGERS · 2013`,blurb:`Een platform maakt delen, meten en totale zichtbaarheid tot morele plicht. Verbinding en controle krijgen hetzelfde logo.`,reaction:`“Privacy is gewoon informatie die nog niet gezellig gedeeld is.”`,effects:{power:6,voice:-5,hype:4},tags:A({data:2,control:2})}],scenes:[{id:`zuck-feed`,kind:`feed`,chapter:`DE TIJDLIJNMACHINE`,rail:`MAAK VERSLAVEND`,kicker:`MENLO PARK · NOOR, 17 JAAR`,warning:`GEEN INSTELLING IS NEUTRAAL`,title:`HOUD NOOR`,accent:`NOG EVEN HIER.`,body:`Noor is 17. Jij bepaalt met vijf schuifknoppen wat zij bovenaan ziet, en of haar tijdlijn ooit ophoudt.`,fact:`Meta gebruikt een algoritme dat bepaalt welke berichten bovenaan staan. Noor en de getallen zijn verzonnen.`,factLabel:`GEDOCUMENTEERD`,thinker:`VERBEEK`,initials:`PV`,mood:`vraagt hoeveel ruimte Noor overhoudt`,heckle:`Kan Noor zich nog zelf tot haar tijdlijn verhouden, of doet de tijdlijn dat voor haar?`,concept:`VRIJHEID ALS JE-VERHOUDEN (VERBEEK)`,conceptDefinition:`Verbeek: vrijheid is niet vrij zijn van techniek, maar je er op een eigen manier toe kunnen verhouden. Techniek bemiddelt ook dat vermogen.`,choices:[{title:`MAAK HET ZO SPANNEND MOGELIJK`,subtitle:`Vooral berichten die Noor boos of onzeker maken.`,effects:{hype:15,safety:-13,voice:-12,humanity:-16,power:9},board:`cheer`,resultTitle:`NOOR BLIJFT KIJKEN. ZE VOELT ZICH SLECHTER.`,lens:`Woede en onzekerheid laten Noor weinig ruimte om zich tot de app te verhouden. De tijdlijn kiest haar reactie al voor ze nadenkt.`,outcome:`Noor zit langer in de app. Jouw grafiek noemt dat succes.`,tags:A({data:4,control:4,care:-2})},{title:`MAAK ER EEN WINKELSTRAAT VAN`,subtitle:`Betaalde advertenties op de beste plekken.`,effects:{hype:12,safety:-6,voice:-8,humanity:-9,power:8},board:`cheer`,resultTitle:`NOORS AANDACHT IS NU TE KOOP.`,lens:`Een advertentie toont een onzekerheid en verkoopt meteen de oplossing. Noors oordeel over wat goed voor haar is, wordt voorgekookt.`,outcome:`Adverteerders betalen om vooraan te staan. Jij verdient aan elke seconde.`,tags:A({data:3,power:3,control:2})},{title:`GEEF DE TIJDLIJN EEN EINDE`,subtitle:`Minder lokberichten en een duidelijk “je bent bij”.`,effects:{hype:-3,safety:12,voice:14,humanity:15,power:-5},board:`grumble`,resultTitle:`NOOR SLUIT DE APP. DIT IS GEEN FOUT.`,lens:`Het einde van de tijdlijn geeft Noor een moment om zelf te kiezen. Dat is vrijheid volgens Verbeek: je kunnen verhouden tot de techniek.`,outcome:`Jouw schermtijd daalt. Noor krijgt tijd terug.`,tags:A({care:4,freedom:3,body:2})},{title:`MAAK HET HEEL GEZELLIG`,subtitle:`Veel vrienden en fijne berichten, zonder einde.`,effects:{},board:`shrug`,resultTitle:`ZE HEEFT HET LEUK. ZE IS ER NOG STEEDS.`,lens:`Prettig is nog niet vrij. Ook een gezellige tijdlijn zonder einde laat Noor geen moment om zich ertoe te verhouden.`,outcome:`Noor voelt zich goed. Juist daarom blijft ze.`,tags:{}},{title:`LAAT HET DOORLOPEN`,subtitle:`Een gemengde tijdlijn die altijd iets nieuws aanbiedt.`,effects:{},board:`shrug`,resultTitle:`NIETS EXTREEMS. WEL ALTIJD NOG EEN BERICHT.`,lens:`Zonder einde biedt de app geen moment om opnieuw te kiezen. Ook een neutraal lijkende stroom richt Noors vrijheid in.`,outcome:`Geen woedemachine. Wel een app die nooit zegt dat het genoeg is.`,tags:{}}]},{id:`zuck-emoji`,chapter:`DE BOZE KNOP`,rail:`MEET HET GEVOEL`,kicker:`2017 · DE REACTIEKNOPPEN`,warning:`METEN IS OOK MAKEN`,title:`DE BOZE EMOJI`,accent:`TELT VIJF KEER.`,body:`Naast de like komen er emoji, ook een boze. Het algoritme telt elke emoji vijf keer zo zwaar. Jij zegt: wij meten alleen wat mensen voelen. Sinds de knop is er wel opvallend veel boosheid.`,fact:`Volgens interne documenten telde Facebook emoji-reacties, ook de boze, vanaf 2017 vijf keer zo zwaar als een like. Later is dat verlaagd.`,factLabel:`GEDOCUMENTEERD`,source:{label:`The Washington Post · Five points for anger, one for a like · oktober 2021`,url:`https://www.washingtonpost.com/technology/2021/10/26/facebook-angry-emoji-algorithm/`},art:{src:gameArt["scene-angry-emoji.webp"],alt:`Zuckerberg drukt op de boze reactie. Dezelfde boze emoji verschijnt groot in een tijdlijn waar een vinger opnieuw op de reactieknop drukt.`,caption:`SATIRE · BOZE KLIK. HOGER IN DE TIJDLIJN. NOG EEN BOZE KLIK.`},thinker:`BARAD`,initials:`KB`,mood:`vraagt wat er eerst was`,heckle:`Bestond de boze gebruiker al voordat jouw knop hem mat?`,concept:`INTRA-ACTIE (BARAD)`,conceptDefinition:`Barad: bij intra-actie liggen grenzen en eigenschappen niet vooraf vast. Ze ontstaan pas in de praktijk zelf. Wie meet, vormt mee wat er gemeten wordt, en is daar verantwoordelijk voor.`,contrast:`Meer dan elkaar beïnvloeden: bij gewone interactie bestaan de dingen al en botsen ze daarna.`,choices:[{title:`LAAT BOOS ZWAAR TELLEN`,subtitle:`Wat veel reacties krijgt, moet iedereen zien.`,effects:{hype:14,safety:-11,voice:-6,humanity:-12,power:7},board:`cheer`,resultTitle:`JE HEBT WOEDE EEN PROMOTIE GEGEVEN.`,lens:`Knop, weging en gebruiker maken samen “de boze gebruiker”. Die lag niet klaar om gemeten te worden: hij ontstaat in de intra-actie.`,outcome:`Wie boos maakt, komt bovenaan. Iedereen leert snel wat werkt.`,tags:A({data:2,control:2,speed:3,care:-1})},{title:`WIJ METEN ALLEEN`,subtitle:`De cijfers tonen gewoon hoe mensen zijn.`,effects:{hype:6,safety:-5,humanity:-6,power:6,voice:-4},board:`shrug`,resultTitle:`DE THERMOMETER ONTKENT DE KOORTS.`,lens:`Je beschrijft het als interactie: eerst waren er boze mensen, toen kwam de meting. Barad zegt: de meting doet mee, dus jij ook.`,outcome:`Je presenteert de boosheid als ontdekking. De knop staat er nog.`,tags:A({data:1,control:2,power:1})},{title:`ERKEN DAT JE MEEBOUWT`,subtitle:`Maak de weging openbaar en laat gebruikers haar aanpassen.`,effects:{hype:-5,safety:10,voice:12,humanity:9,power:-6},board:`grumble`,resultTitle:`DE MEETLAT LIGT OP TAFEL.`,lens:`Je erkent dat het instrument vormt wat het meet. Bij Barad hoort daar verantwoordelijkheid bij voor de gevolgen.`,outcome:`Gebruikers zien hoe ze gemeten worden. Sommigen meten terug.`,tags:A({democracy:3,care:3,freedom:2})}]},{id:`zuck-realname`,chapter:`DE ECHTE NAAM`,rail:`WEES JEZELF`,kicker:`2014 · HET ECHTE-NAMENBELEID`,warning:`WIE BEPAALT WAT ECHT IS?`,title:`ÉÉN MENS,`,accent:`ÉÉN ECHTE NAAM.`,body:`Op jouw platform heeft iedereen één profiel met één echte naam. Dragqueens, mensen met een artiestennaam en wie onder een andere naam veilig is, raken hun account kwijt.`,fact:`Facebook blokkeerde in 2014 accounts van onder meer dragqueens om zijn echte-namenbeleid. Topman Chris Cox bood op 1 oktober 2014 excuses aan.`,factLabel:`GEDOCUMENTEERD`,source:{label:`Wikipedia · Facebook real-name policy controversy`,url:`https://en.wikipedia.org/wiki/Facebook_real-name_policy_controversy`},art:{src:gameArt["scene-real-name.webp"],alt:`Een dragartiest toont aan het loket twee kaarten met verschillende portretten van dezelfde persoon. Zuckerberg houdt een rode stempel omhoog.`,caption:`SATIRE · TWEE KAARTJES, ÉÉN PERSOON. WELKE LAAT ZUCK DOOR?`},thinker:`HARAWAY`,initials:`DH`,mood:`verstoort het heldere plaatje`,heckle:`Wie de norm voor “echt” vastlegt, sluit uit wie er niet in past. Wie past er niet in de jouwe?`,concept:`CYBORG (HARAWAY)`,conceptDefinition:`Haraway: de cyborg is een grensfiguur zonder vaste, zuivere identiteit. Er zijn geen vaste kenmerken die bepalen wie “echt” mens is. Dat helpt tegen uitsluiting.`,contrast:`Niet de cyborg van Clark: die laat zien wat de mens van nature is. Bij Haraway breekt de cyborg vaste grenzen open.`,choices:[{title:`ÉÉN NAAM, ÉÉN PROFIEL`,subtitle:`Echte mensen hebben één echte identiteit.`,effects:{hype:8,safety:3,voice:-11,humanity:-10,power:9},board:`cheer`,resultTitle:`ADVERTEERDERS WETEN EINDELIJK WIE JE BENT.`,lens:`Je legt een norm vast voor wie echt is. Haraway zegt: zo’n vaste identiteit bestaat niet, en de norm sluit uit wie er niet aan voldoet.`,outcome:`Het profiel is overzichtelijk. De mensen die er niet in pasten, zijn weg.`,tags:A({data:2,control:3,power:2})},{title:`LAAT HET SYSTEEM ECHTHEID METEN`,subtitle:`Een algoritme schat hoe echt een account is.`,effects:{hype:5,safety:-2,voice:-8,humanity:-8,power:7},board:`shrug`,resultTitle:`JE BENT 71 PROCENT ECHT.`,lens:`De grens tussen echt en nep is nu een score, maar het blijft een vaste grens. Volgens Haraway is juist die grens het probleem.`,outcome:`Het systeem twijfelt aan iedereen die twee levens leidt. Dat zijn er veel.`,tags:A({data:3,control:2,copy:1})},{title:`MEERDERE GEZICHTEN MOGEN`,subtitle:`Artiestennaam, tweede profiel, avatar: het mag naast elkaar.`,effects:{hype:-5,safety:2,voice:13,humanity:11,power:-6},board:`grumble`,resultTitle:`JE PLATFORM IS ROMMELIG. NET ALS MENSEN.`,lens:`Je laat samengestelde identiteiten naast elkaar bestaan en houdt het troebele uit: staying with the trouble.`,outcome:`Adverteerders klagen over onduidelijke doelgroepen. Gebruikers niet.`,tags:A({freedom:3,care:3,democracy:1})}]},{id:`zuck-metaverse`,chapter:`DE GROTE VERHUIZING`,rail:`META`,kicker:`REALITY LABS · HORIZON`,warning:`BENEN LATER BESCHIKBAAR`,title:`BOUW DE VOLGENDE`,accent:`WERKELIJKHEID.`,body:`Je stopt miljarden in een virtuele wereld. Met een VR-bril op moet het voelen alsof je er echt bent. Het publiek ziet vooral avatars zonder benen.`,fact:`Meta maakte de metaverse tot zijn grote toekomstplan. Onderdeel Reality Labs verloor in 2025 ongeveer 19,2 miljard dollar.`,factLabel:`GEDOCUMENTEERD`,art:{src:gameArt["scene-metaverse-legs.webp"],alt:`Satirische stripillustratie van Mark Zuckerberg als zwevende metaverse-avatar zonder benen, naast een gebruiker die wel op echte benen staat`,caption:`SATIRE · HET BEENLOZE POPPETJE TOONT HET LICHAAMSPROBLEEM`},thinker:`DREYFUS + 4E`,initials:`4E`,mood:`zoekt voeten op de vloer`,heckle:`Kan een wereld echt voelen als je lichaam niet meedoet?`,concept:`BELICHAAMDE COGNITIE`,conceptDefinition:`Embodied cognition: denken heeft een lichamelijke basis. Je zintuiglijke, bewegende lichaam bepaalt hoe je de wereld ervaart. Dat geldt voor de gebruiker, ook met een bril op.`,choices:[{title:`GEEF NOG MEER MILJARDEN UIT`,subtitle:`Betere brillen overtuigen het lichaam vanzelf.`,effects:{hype:-4,safety:-6,humanity:-7,power:6},board:`grumble`,resultTitle:`DE TOEKOMST HEEFT NOG STEEDS GEEN BENEN.`,lens:`Je denkt dat beter beeld genoeg is. Belichaamde cognitie zegt: evenwicht, vermoeidheid en beweging bepalen mee hoe echt iets voelt.`,outcome:`Je koopt tijd met miljarden. Tijd blijkt een dure VR-bril.`,tags:A({speed:3,control:2,copy:1})},{title:`ONTWERP VANUIT HET LICHAAM`,subtitle:`Comfort, duizeligheid en echte situaties eerst.`,effects:{hype:3,safety:10,humanity:14,voice:7},board:`shrug`,resultTitle:`DE AVATAR KRIJGT EINDELIJK EEN LICHAAMSVRAAG.`,lens:`Je neemt het lichaam als vertrekpunt. Belichaamde cognitie wordt een ontwerpregel in plaats van een voetnoot.`,outcome:`Minder sciencefiction, meer duizeligheidstests.`,tags:A({body:4,care:3,repair:1})},{title:`STOP MET HORIZON`,subtitle:`Bijna niemand wil in jouw virtuele kantoor wonen.`,effects:{hype:9,safety:4,humanity:6,power:-5},board:`cheer`,resultTitle:`DE BEURS JUICHT. DE AVATARS ZWIJGEN.`,lens:`Een wereld die het lichaam negeert, wordt geen plek waar mensen willen zijn. Jij trekt de conclusie die belichaamde cognitie voorspelt.`,outcome:`Facebook heet nog steeds Meta. Verder doen we alsof dit nooit is gebeurd.`,tags:A({repair:2,body:2})}]},{id:`zuck-politics`,chapter:`DE DRAAIBEURT`,rail:`MEER MENINGSUITING`,kicker:`JANUARI 2025 · NIEUWE REGELS`,warning:`MAGA-DRAAI? DAT IS EEN DUIDING`,title:`LAAT GEBRUIKERS`,accent:`DE WAARHEID CONTROLEREN.`,body:`Meta stopt in de VS met onafhankelijke feitencontroleurs. Gebruikers mogen zelf uitleg onder berichten zetten. Meta noemt dat vrije meningsuiting. Critici zien aanpassing aan Trump.`,fact:`Feit: Meta verving feitencontroleurs door Community Notes. “MAGA-draai” is een duiding; de pet hieronder is satire.`,factLabel:`INTERPRETATIE`,thinker:`WIJSGERIGE ANTROPOLOGIE`,initials:`B1`,mood:`kijkt welke rol het systeem je geeft`,h
